# DRAFT: not yet applied anywhere. Check against the VPS survey (modules, existing vhosts) first.
#
# STEP 1 of 2: a plain-http vhost whose only job is to let Let's Encrypt prove we own the name.
# No proxy to the app here: passwords must never travel over http, even briefly.
#
#   sudo mkdir -p /var/www/cosmicray-acme
#   sudo cp apache-1-bootstrap.conf /etc/apache2/sites-available/cosmicray-bootstrap.conf
#   sudo a2ensite cosmicray-bootstrap && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot certonly --webroot -w /var/www/cosmicray-acme -d cosmicray.accel-kitchen.com \
#        --deploy-hook "systemctl reload apache2"
#
# (If the survey shows certificates are issued some other way, follow that instead.)
# Then go to apache-2-final.conf.
<VirtualHost *:80>
    ServerName cosmicray.accel-kitchen.com
    DocumentRoot /var/www/cosmicray-acme
    <Directory /var/www/cosmicray-acme>
        Require all granted
    </Directory>
    ErrorLog  ${APACHE_LOG_DIR}/cosmicray-error.log
    CustomLog ${APACHE_LOG_DIR}/cosmicray-access.log combined
</VirtualHost>
