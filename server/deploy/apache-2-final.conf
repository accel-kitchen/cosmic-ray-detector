# DRAFT: not yet applied anywhere. Check against the VPS survey first.
#
# STEP 2 of 2: the real vhost, once the certificate exists.
#   sudo a2dissite cosmicray-bootstrap
#   sudo cp apache-2-final.conf /etc/apache2/sites-available/cosmicray.conf
#   sudo a2enmod proxy proxy_http headers ssl rewrite       # the survey says which are already on
#   sudo a2ensite cosmicray && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Rules this file follows (each one is a lesson from the old server):
#  1. The WHOLE host goes to the app. Not a list of paths: the old vhost forwarded only some
#     paths, so /health and /latest-data never reached the app and nobody noticed.
#  2. NO CORS headers here. The app sets Access-Control-Allow-Origin itself; a second copy
#     from Apache makes browsers reject the response ("multiple values"), and a missing one
#     is what broke the old server. One place only: the app.
#  3. mod_proxy appends the real client address to X-Forwarded-For (it does not replace what the
#     client sent). The app trusts only the loopback hop, so it takes the right-most address
#     that is not loopback: the one Apache added. Do not put mod_remoteip or another proxy in
#     front without revisiting that. server/deploy/smoke.sh checks this end to end.

<VirtualHost *:80>
    ServerName cosmicray.accel-kitchen.com
    # Certificate renewals still use plain http for the challenge; everything else goes to https.
    Alias /.well-known/acme-challenge/ /var/www/cosmicray-acme/.well-known/acme-challenge/
    <Directory /var/www/cosmicray-acme/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://cosmicray.accel-kitchen.com%{REQUEST_URI} [R=301,L]
    ErrorLog  ${APACHE_LOG_DIR}/cosmicray-error.log
    CustomLog ${APACHE_LOG_DIR}/cosmicray-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName cosmicray.accel-kitchen.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/cosmicray.accel-kitchen.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cosmicray.accel-kitchen.com/privkey.pem
    # The survey found this file (the existing accel-kitchen.com vhost includes it too).
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Access logs contain client addresses. Decide how long they are kept (logrotate)
    # and say so in the privacy policy (plan, Q-N2).
    ErrorLog  ${APACHE_LOG_DIR}/cosmicray-error.log
    CustomLog ${APACHE_LOG_DIR}/cosmicray-access.log combined

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3100/ retry=0 timeout=30
    ProxyPassReverse / http://127.0.0.1:3100/
    RequestHeader set X-Forwarded-Proto "https"

    # The app accepts at most 32 kB; refuse anything much larger before it reaches Node.
    LimitRequestBody 65536

    # Only headers the app does NOT already send. The app sets X-Content-Type-Options itself; adding
    # it here too would send it twice (a header Apache "sets" is added alongside the app's, not over it).
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>
