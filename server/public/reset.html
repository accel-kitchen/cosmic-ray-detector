<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新しいパスワード | CosmicRay 観測ネットワーク</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="site"><div class="bar"><a class="brand" href="/">CosmicRay 観測ネットワーク</a><nav id="nav"></nav></div></header>
<main>
  <h1>新しいパスワードを決める</h1>
  <form id="form" class="stack hidden" novalidate>
    <label>新しいパスワード<small>10 文字以上。</small>
      <input id="password" type="password" required minlength="10" maxlength="256" autocomplete="new-password">
    </label>
    <label>新しいパスワード（もう一度）
      <input id="password2" type="password" required minlength="10" maxlength="256" autocomplete="new-password">
    </label>
    <div class="row"><button id="go" type="submit">パスワードを変える</button></div>
  </form>
  <div id="msg"></div>
  <div id="after" class="hidden">
    <p>以前にログインしていた端末は、すべてログアウトされました。Console のパスワードも、新しいものに入れ直してください。</p>
    <p><a class="btn" href="/account">ログインする</a></p>
  </div>
  <div id="bad" class="hidden">
    <p>リンクが無効なときは、<a href="/forgot">こちら</a>からもう一度、再設定のメールを送ってください。</p>
  </div>
</main>
<footer class="site">
  <a href="/terms">利用規約</a> ・ <a href="/privacy">プライバシーについて</a> ・ 加速キッチン
</footer>
<script src="/js/common.js"></script>
<script src="/js/reset.js"></script>
</body>
</html>
