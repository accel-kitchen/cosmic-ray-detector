<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パスワードの再設定・確認メールの再送 | CosmicRay 観測ネットワーク</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="site"><div class="bar"><a class="brand" href="/">CosmicRay 観測ネットワーク</a><nav id="nav"></nav></div></header>
<main>
  <h1>パスワードの再設定</h1>
  <p class="lead">登録したメールアドレスを入れてください。再設定のリンクをメールで送ります（1 時間有効、1 回だけ使えます）。</p>
  <form id="forgot" class="stack" novalidate>
    <label>メールアドレス
      <input id="forgot-email" type="email" required maxlength="254" autocomplete="email">
    </label>
    <div class="row"><button id="forgot-go" type="submit">再設定のメールを送る</button></div>
    <div id="forgot-msg"></div>
  </form>
  <div class="note">登録されているかどうかは、この画面では分かりません（他の人に知られないためです）。メールが届かないときは、迷惑メールのフォルダも見てください。</div>

  <h2>確認メールをもう一度送る</h2>
  <p class="lead">登録したのに、メールアドレスの確認がまだのときは、こちらから確認メールを再送できます（24 時間有効）。</p>
  <form id="resend" class="stack" novalidate>
    <label>メールアドレス
      <input id="resend-email" type="email" required maxlength="254" autocomplete="email">
    </label>
    <div class="row"><button id="resend-go" type="submit" class="secondary">確認メールを再送する</button></div>
    <div id="resend-msg"></div>
  </form>
</main>
<footer class="site">
  <a href="/terms">利用規約（案）</a> ・ <a href="/privacy">プライバシーについて（案）</a> ・ 加速キッチン
</footer>
<script src="/js/common.js"></script>
<script src="/js/forgot.js"></script>
</body>
</html>
