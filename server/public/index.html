<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>観測局マップ | CosmicRay 観測ネットワーク</title>
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
</head>
<body>
<header class="site"><div class="bar"><a class="brand" href="/">CosmicRay 観測ネットワーク</a><nav id="nav"></nav></div></header>
<main>
  <h1>観測局マップ</h1>
  <p class="lead">自宅や学校で宇宙線を測っている観測局です。位置は、約 10 km 四方のマスの中心に丸めて表示しています（正確な場所は、サーバーにも保存していません）。</p>
  <div class="mapwrap">
    <div>
      <div id="map" role="application" aria-label="観測局の地図"></div>
      <div class="legend">
        <span><span class="dot today"></span>今日データあり</span>
        <span><span class="dot week"></span>今週データあり</span>
        <span><span class="dot"></span>休止中</span>
      </div>
      <div id="mapnote"></div>
    </div>
    <div>
      <h2>観測局の一覧</h2>
      <ul id="list" class="stations"></ul>
      <p id="empty" class="hidden">まだ地図に載っている観測局はありません。</p>
    </div>
  </div>
  <div class="note">グラフ（1 時間ごとの計数や温度など）は、<strong>ログインした参加者</strong>だけが見られます。観測局の名前を選んでください。</div>
</main>
<footer class="site">
  <a href="/terms">利用規約</a> ・ <a href="/privacy">プライバシーについて</a> ・ 加速キッチン
</footer>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/js/common.js"></script>
<script src="/js/map.js"></script>
</body>
</html>
