<text x="616" y="186" font-size="12" fill="#5B6770">D10 は基板の中で</text>
<text x="616" y="202" font-size="12" fill="#5B6770">J4-4 とつながっています</text>
<rect x="30" y="200" width="170" height="240" rx="10" fill="#EEF1F3" stroke="#6B747A" stroke-width="2"/>
<text x="115" y="224" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2A33">GT-502MGG-N</text>
<text x="115" y="242" font-size="11" text-anchor="middle" fill="#5B6770">5 線ケーブル (先端むき出し)</text>
<text x="188" y="276" font-size="12" text-anchor="end" fill="#1F2A33">1  VCC</text>
