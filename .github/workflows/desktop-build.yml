# CosmicRay Console デスクトップ版（arduino/v2/desktop）を Windows と Mac で作る。
# Mac 版は Mac の上でしか作れないので、GitHub の macOS ランナーを使う。
# 動かし方: Actions タブの "desktop-build" → Run workflow、または desktop-v* のタグを push する。
# できたファイルは、その実行の Artifacts からダウンロードする（署名なし）。
name: desktop-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              arduino/v2/desktop/dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: |
              arduino/v2/desktop/dist/*.dmg
              arduino/v2/desktop/dist/*.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: arduino/v2/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arduino/v2/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          # 署名の証明書を持っていないので、探しに行かせない。Mac は package.json の identity "-" で
          # アドホック署名だけする（署名が無いと Apple シリコンの Mac は起動を拒む）。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the Mac app signature
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac*/*.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier|Format'
          done
      - uses: actions/upload-artifact@v5
        with:
          name: cosmicray-console-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
