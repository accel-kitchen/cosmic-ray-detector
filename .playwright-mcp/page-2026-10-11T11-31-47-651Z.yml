          - listitem [ref=e267]:
            - generic [ref=e268]: ③
            - generic [ref=e269]:
              - text: SiPM
              - paragraph: 35 µm のマイクロセルが 18,980 個並んだ SiPM。光子が当たったセルで、なだれ増倍が起きます。
          - listitem [ref=e270]:
            - generic [ref=e271]: ④
            - generic [ref=e272]:
