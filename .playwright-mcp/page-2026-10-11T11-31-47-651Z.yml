      - generic [ref=e113]:
        - generic [ref=e114]:
          - paragraph [ref=e115]: 01 — INSIDE
          - heading "部品ごとに、 役割があります。" [level=2] [ref=e116]: 部品ごとに、役割があります。
          - paragraph [ref=e117]: 光を受けてから記録するまで。カメラが該当する部品へ移動します。
        - article [ref=e118]:
          - text: 01 / 10
          - heading "光を受ける シンチレータ × SiPM" [level=3] [ref=e119]:
            - text: 光を受ける
            - generic [ref=e120]: シンチレータ × SiPM
          - paragraph [ref=e121]: ミューオンがシンチレータを通ると、落としたエネルギーの一部が光になります。その光を 6 mm 角の SiPM（onsemi MICROFC-60035）が電気のパルスに変えます。SiPM は 40 mm 角の子基板にのっていて、子基板ごと品種を差し替えられます。
          - list [ref=e122]:
            - listitem [ref=e123]: マイクロセル 35 µm × 18,980
            - listitem [ref=e124]:
              - text: V
              - subscript [ref=e125]: br
              - text: 24.2〜24.7 V
            - listitem [ref=e126]: J1 / J2：HV・GND・信号 ×2
        - article [ref=e127]:
          - text: 02 / 10
          - heading "バイアスをつくる HV 29.0 V" [level=3] [ref=e128]:
            - text: バイアスをつくる
            - generic [ref=e129]: HV 29.0 V
          - paragraph [ref=e130]: 裏面の LT3461 が USB の 5 V から 29.0 V を昇圧してつくり、降伏電圧より 4.3〜4.8 V 高くかけます。値は抵抗の分圧で固定。子基板の 49.9 Ω と 10 µF でノイズを落としてから SiPM に届けます。
          - list [ref=e131]:
            - listitem [ref=e132]: HV = 1.255 × (1 + 221k / 10k)
            - listitem [ref=e133]: L1 47 µH
        - article [ref=e134]:
          - text: 03 / 10
          - heading "増幅する LT1807（U2A）" [level=3] [ref=e135]:
            - text: 増幅する
            - generic [ref=e136]: LT1807（U2A）
          - paragraph [ref=e137]: SiPM の電流は子基板の R12（49.9 Ω）で電圧になり、U2A の非反転アンプで増幅されます。ゲインは裏面のトリマ R10 で ×5.0〜×45。入力は 1 kΩ と BAT54S で守られています。アンプの出力は TP2 で測れます。
          - list [ref=e138]:
            - listitem [ref=e139]: G = 1 + (R5 + R10) / R3
            - listitem [ref=e140]: R3 249 Ω・R5 1 kΩ
            - listitem [ref=e141]: DC 結合
        - article [ref=e142]:
          - text: 04 / 10
          - heading "山の高さをつかむ ピークホールドとしきい値" [level=3] [ref=e143]:
            - text: 山の高さをつかむ
            - generic [ref=e144]: ピークホールドとしきい値
          - paragraph [ref=e145]: U2B のピークホールドが、数百 ns のパルスの山を 2 倍にしてコンデンサ C6 にためます。ためた電圧は A0 に出てきます。マイコンが読み終わると、D8 から 20 µs のパルスを出して Q1 で放電し、次のパルスに備えます。
          - list [ref=e146]:
            - listitem [ref=e147]: ホールド ×2
            - listitem [ref=e148]: A0 に出力
            - listitem [ref=e149]: D8 → Q1 で放電
        - article [ref=e150]:
          - text: 05 / 10
          - heading "読み取る Arduino Nano ESP32" [level=3] [ref=e151]:
            - text: 読み取る
            - generic [ref=e152]: Arduino Nano ESP32
          - paragraph [ref=e153]: A0（ホールドの出力）を読み続け、しきい値を超えたらイベントとして扱います。外部検出器の同時判定を待ってから A0 を 12 bit で読み、その値が波高になります。しきい値は起動のたびに、A0 を 1 秒見てノイズの最大値 + 50 に自動で合わせます。
          - list [ref=e154]:
            - listitem [ref=e155]: ESP32-S3・BLE
            - listitem [ref=e156]: A0 をソフトで比較
            - listitem [ref=e157]: トリガーの約 60 µs 後に読む
        - article [ref=e158]:
          - text: 06 / 10
          - heading "残す microSD" [level=3] [ref=e159]:
            - text: 残す
            - generic [ref=e160]: microSD
          - paragraph [ref=e161]:
            - text: FAT32 のカードに
            - code [ref=e162]: /LOG0001.TXT
            - text: から順にログを書きます。1 行ごとに書き込みを確定するので、USB を抜いても失うのはせいぜい最後の 1 行。USB と Bluetooth に出すのと同じ行がそのまま残ります。
          - list [ref=e163]:
            - listitem [ref=e164]: Hirose DM3AT
            - listitem [ref=e165]: SPI 4 MHz
            - listitem [ref=e166]: 背面から差す
        - article [ref=e167]:
          - text: 07 / 10
          - heading "環境を測る BME280" [level=3] [ref=e168]:
            - text: 環境を測る
            - generic [ref=e169]: BME280
          - paragraph [ref=e170]: 温度・湿度・気圧を 2 秒ごとに読み、各イベントの行に書きます。気圧が上がると計数率が下がる「気圧効果」を調べられます。SiPM の降伏電圧は 1 °C あたり約 21.5 mV 変わるので、温度はあとで波高を見直すときにも使います。
          - list [ref=e171]:
            - listitem [ref=e172]: I²C
            - listitem [ref=e173]: 温度・湿度・気圧
        - article [ref=e174]:
          - text: 08 / 10
          - heading "知らせる OLED・LED・ブザー" [level=3] [ref=e175]:
            - text: 知らせる
            - generic [ref=e176]: OLED・LED・ブザー
          - paragraph [ref=e177]: 基板の端に立てた 0.96 インチ OLED に、計数・計数率・しきい値・環境値を 2 秒ごとに表示。イベントごとに LED が光り、ブザーが波高に応じた高さで「ピッ」と鳴ります（対数で 500〜4000 Hz）。A7 に振動モーターを後付けすると、大きなパルスほど長く震えます。
          - list [ref=e178]:
            - listitem [ref=e179]: SSD1306 128 × 64
            - listitem [ref=e180]: 25 ms のビープ
            - listitem [ref=e181]: 振動 20〜120 ms
        - article [ref=e182]:
          - text: 09 / 10
          - heading "つなぐ 3.5 mm ジャック × 4" [level=3] [ref=e183]:
            - text: つなぐ
            - generic [ref=e184]: 3.5 mm ジャック × 4
          - paragraph [ref=e185]: OUT が 1 つ、IN が 3 つ。自分がトリガーすると COIN_OUT（3.3 V・100 µs）を出し、50 µs 待ってから相手の COIN_OUT を読みます。相手もほぼ同時に反応していれば、そのジャックの列が 1 になります。アナログの波高も読めます。
          - list [ref=e186]:
            - listitem [ref=e187]: TRRS ケーブル
            - listitem [ref=e188]: 最大 4 台
            - listitem [ref=e189]: 同時の窓 約 ±50 µs
        - article [ref=e190]:
          - text: 10 / 10
          - heading "包む 3D プリントのケース" [level=3] [ref=e191]:
            - text: 包む
            - generic [ref=e192]: 3D プリントのケース
          - paragraph [ref=e193]:
            - text: ケース本体は前面だけが閉じた箱で、基板の組を背面から差し込み、厚さ 1 mm の背面板で閉じます。前面に OLED の窓とボタン、側面にジャック 4 つ、背面に USB-C と microSD。STL は
            - code [ref=e194]: cad/
            - text: にあります。
          - list [ref=e195]:
            - listitem [ref=e196]: FDM 印刷
            - listitem [ref=e197]: 76 × 74 × 71.5 mm
            - listitem [ref=e198]: 背面板 ねじ 4 本
