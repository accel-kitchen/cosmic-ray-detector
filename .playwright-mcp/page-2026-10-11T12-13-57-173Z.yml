            - generic [ref=f11e297]:
              - text: パルス
              - paragraph: 子基板の R12（49.9 Ω）で電圧になります。数百 ns の速いパルスです。
          - listitem [ref=f11e298]:
            - generic [ref=f11e299]: ⑤
            - generic [ref=f11e300]:
