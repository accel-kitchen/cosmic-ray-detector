            - paragraph [ref=f11e598]: 反射材で包み、黒いテープで光をふさいで SiPM にのせます。すき間があると蛍光灯の光でカウントが跳ね上がります。
        - listitem [ref=f11e599]:
          - generic [ref=f11e600]: "3"
          - generic [ref=f11e601]:
            - generic [ref=f11e602]: microSD を入れる（任意）
            - paragraph [ref=f11e603]: FAT32 のカードを側面の開口から J8 に。入れなくても USB と Bluetooth には出ます。
        - listitem [ref=f11e604]:
          - generic [ref=f11e605]: "4"
          - generic [ref=f11e606]:
            - generic [ref=f11e607]: USB-C でつなぐ
            - paragraph [ref=f11e608]: PC かモバイルバッテリーへ。起動のたびに A0 を 1 秒見てしきい値を決めるので、その間は動かさずに待ちます。
        - listitem [ref=f11e609]:
          - generic [ref=f11e610]: "5"
          - generic [ref=f11e611]:
            - generic [ref=f11e612]: OLED と LED を見る
            - paragraph [ref=f11e613]: "Cnt が増え、LED が光ってブザーが鳴れば動いています。Thr: がしきい値です。"
        - listitem [ref=f11e614]:
          - generic [ref=f11e615]: "6"
          - generic [ref=f11e616]:
            - generic [ref=f11e617]: コンソールで見る
            - paragraph [ref=f11e618]: Chrome / Edge で arduino/v2/console/index.html を開いて「USBでつなぐ」。時間とともにヒストグラムが育ち、計数率の誤差が小さくなります。
    - generic [ref=f11e620]:
      - generic [ref=f11e621]:
        - paragraph [ref=f11e622]: 10 — SPEC
        - heading "仕様" [level=2] [ref=f11e623]
      - generic [ref=f11e624]:
        - generic [ref=f11e625]:
          - term [ref=f11e626]: 検出のしかた
          - definition [ref=f11e627]: シンチレータ ＋ SiPM（onsemi MICROFC-60035-SMT：受光 6 × 6 mm、マイクロセル 35 µm）。SiPM は 40 × 40 mm の子基板に載せ、2×3 ピンで接続
        - generic [ref=f11e628]:
          - term [ref=f11e629]: SiPM バイアス
          - definition [ref=f11e630]: LT3461 昇圧、29.0 V 固定（USB の 5 V から）。子基板で RC フィルタ
        - generic [ref=f11e631]:
          - term [ref=f11e632]: アンプ
          - definition [ref=f11e633]: LT1807（U2A）非反転、×5.0〜×45（R10 で調整）。入力保護 1 kΩ ＋ BAT54S
        - generic [ref=f11e634]:
          - term [ref=f11e635]: ピークホールド
          - definition [ref=f11e636]: LT1807（U2B）＋ ダイオード ＋ C6、アンプ出力の ×2 を保持。放電の時定数は数百 µs（計算 487 µs）。D8 → Q1 で 20 µs 放電
        - generic [ref=f11e637]:
          - term [ref=f11e638]: マイコン
          - definition [ref=f11e639]: Arduino Nano ESP32（ESP32-S3、BLE）。裏面のソケットに差す
        - generic [ref=f11e640]:
          - term [ref=f11e641]: トリガー
          - definition [ref=f11e642]: アナログ。A0（ピークホールドの出力）をソフトでしきい値と比べ、超えたらイベントとして記録。しきい値は起動時に自動で決まり、あとから変えられます
        - generic [ref=f11e643]:
          - term [ref=f11e644]: 波高
          - definition [ref=f11e645]: 12 bit（0〜4095）。トリガーの約 60 µs 後に A0 を 1 回読む
        - generic [ref=f11e646]:
          - term [ref=f11e647]: デッドタイム
          - definition [ref=f11e648]: イベントの処理（約 0.1 ms）、2 秒ごとの OLED 書き換え、オシロ表示中、コマンド実行中。ログに累積値を出力
        - generic [ref=f11e649]:
          - term [ref=f11e650]: 環境センサ
          - definition [ref=f11e651]: BME280（温度・湿度・気圧）、2 秒ごとに更新
        - generic [ref=f11e652]:
          - term [ref=f11e653]: 表示・通知
          - definition [ref=f11e654]: OLED SSD1306 128 × 64、LED、圧電ブザー（500〜4000 Hz）、振動モーター（A7 に後付け、ドライバが必要）
        - generic [ref=f11e655]:
          - term [ref=f11e656]: 記録・通信
          - definition [ref=f11e657]: USB シリアル（9600 bps）、Bluetooth LE（Nordic UART、名前 CosmicRay）、microSD（FAT32、1 行ごとに確定）
        - generic [ref=f11e658]:
          - term [ref=f11e659]: 外部入出力
          - definition [ref=f11e660]: OUT × 1、IN × 3（3.5 mm 4 極）。デジタルの同時判定とアナログの波高
        - generic [ref=f11e661]:
          - term [ref=f11e662]: オシロスコープ
          - definition [ref=f11e663]: A0 を DMA で 83.3 kHz、1 イベント 161 点。毎秒 1〜20 波形
        - generic [ref=f11e664]:
          - term [ref=f11e665]: 電源
          - definition [ref=f11e666]: USB-C 5 V
        - generic [ref=f11e667]:
          - term [ref=f11e668]: 大きさ
          - definition [ref=f11e669]: 読み出し基板 63 × 63 mm、センサ子基板 40 × 40 mm、ケース 86 × 75 × 61.4 mm
      - paragraph [ref=f11e670]: 数値は回路図（KiCad 9）・ファームウェア（COSMICRAY_DETECTOR_ESP32-S3-Nano-v2）・arduino/description.md・shaping.html による値です。回路の見直しを反映した後継機 v2.1 では、整形段と DAC によるしきい値に置き換えています。この装置は自然の宇宙線を数えるためのもので、線量計としての校正はしていません。
