      - generic [ref=f4e235]:
        - paragraph [ref=f4e236]: SCINTILLATOR
        - heading "シンチレータは、 2 種類から選べます。" [level=2] [ref=f4e237]: シンチレータは、2 種類から選べます。
        - paragraph [ref=f4e238]: 基板もケースも同じで、光を出す部分だけが違います。広く集めたいか、小さく持ち運びたいかで選べます。
      - list [ref=f4e239]:
        - listitem [ref=f4e240]:
          - text: プラスチックシンチレータ版
          - generic [ref=f4e243]: 5 cm × 5 cm × 1 cm
          - paragraph [ref=f4e244]: 板のように広い形です。受ける面積が 25 cm² あるので、宇宙線にたくさん当たります。短い時間でも数が集まり、計数率の変化を追いたいときや、2 台を重ねたコインシデンスに向きます。
          - figure "取れるスペクトル 光の弱い側にガンマ線（身のまわりの放射線）、強い側に宇宙線（宇宙から降ってくる放射線）の山。宇宙線だけを選んで数えられます。" [ref=f4e245]:
            - img "プラスチックシンチレータで取ったスペクトル。光の弱い側にガンマ線、強い側に宇宙線の山が分かれて見える" [ref=f4e246]
            - generic [ref=f4e247]:
              - generic [ref=f4e248]: 取れるスペクトル
              - text: 光の弱い側にガンマ線（身のまわりの放射線）、強い側に宇宙線（宇宙から降ってくる放射線）の山。宇宙線だけを選んで数えられます。
        - listitem [ref=f4e249]:
          - text: CsI シンチレータ版
          - generic [ref=f4e252]: 1 cm 立方
          - paragraph [ref=f4e253]: サイコロのように小さな形です。コンパクトで、持ち運びや狭い場所への設置に向きます。受ける面積が小さいぶん、数えられる宇宙線の数は少なめです。
          - figure "取れるスペクトル（花崗岩を測定） ガンマ線のエネルギーごとに山が立ちます。花崗岩にふくまれるウランやトリウムが崩れていく途中でできる Pb-214、Tl-208、Ac-228 が出したガンマ線が、山の位置から読み取れます。" [ref=f4e254]:
            - img "CsI 検出器で花崗岩を測ったガンマ線のスペクトル。いくつかの山があり、その位置から Pb-214、Tl-208、Ac-228 が出したガンマ線だと分かる" [ref=f4e255]
            - generic [ref=f4e256]:
              - generic [ref=f4e257]: 取れるスペクトル（花崗岩を測定）
              - text: ガンマ線のエネルギーごとに山が立ちます。花崗岩にふくまれるウランやトリウムが崩れていく途中でできる Pb-214、Tl-208、Ac-228 が出したガンマ線が、山の位置から読み取れます。
      - paragraph [ref=f4e258]: どちらも、宇宙線が通ると光り、その光を SiPM が電気のパルスに変えるしくみは同じです。横軸は光の強さ（＝落としたエネルギー）、縦軸は数えた回数です。計数率はシンチレータの面積にほぼ比例します（海抜 0 m で 1 cm² あたり毎分およそ 1 個が目安）。
