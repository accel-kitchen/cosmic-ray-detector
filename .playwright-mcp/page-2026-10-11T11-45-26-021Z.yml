          - definition [ref=f4e612]: LT3461 昇圧、29.0 V 固定（USB の 5 V から）。子基板で RC フィルタ
        - generic [ref=f4e613]:
          - term [ref=f4e614]: アンプ
          - definition [ref=f4e615]: LT1807（U2A）非反転、×5.0〜×45（R10 で調整）。入力保護 1 kΩ ＋ BAT54S
        - generic [ref=f4e616]:
          - term [ref=f4e617]: ピークホールド
          - definition [ref=f4e618]: LT1807（U2B）＋ ダイオード ＋ C6、アンプ出力の ×2 を保持。放電の時定数は数百 µs（計算 487 µs）。D8 → Q1 で 20 µs 放電
        - generic [ref=f4e619]:
          - term [ref=f4e620]: マイコン
          - definition [ref=f4e621]: Arduino Nano ESP32（ESP32-S3、BLE）。裏面のソケットに差す
        - generic [ref=f4e622]:
          - term [ref=f4e623]: トリガー
          - definition [ref=f4e624]: アナログ。A0（ピークホールドの出力）をソフトでしきい値と比べ、超えたらイベントとして記録。しきい値は起動時に自動で決まり、あとから変えられます
        - generic [ref=f4e625]:
          - term [ref=f4e626]: 波高
          - definition [ref=f4e627]: 12 bit（0〜4095）。トリガーの約 60 µs 後に A0 を 1 回読む
        - generic [ref=f4e628]:
          - term [ref=f4e629]: デッドタイム
          - definition [ref=f4e630]: イベントの処理（約 0.1 ms）、2 秒ごとの OLED 書き換え、オシロ表示中、コマンド実行中。ログに累積値を出力
        - generic [ref=f4e631]:
          - term [ref=f4e632]: 環境センサ
          - definition [ref=f4e633]: BME280（温度・湿度・気圧）、2 秒ごとに更新
        - generic [ref=f4e634]:
          - term [ref=f4e635]: 表示・通知
          - definition [ref=f4e636]: OLED SSD1306 128 × 64、LED、圧電ブザー（500〜4000 Hz）、振動モーター（A7 に後付け、ドライバが必要）
        - generic [ref=f4e637]:
          - term [ref=f4e638]: 記録・通信
          - definition [ref=f4e639]: USB シリアル（9600 bps）、Bluetooth LE（Nordic UART、名前 CosmicRay）、microSD（FAT32、1 行ごとに確定）
        - generic [ref=f4e640]:
          - term [ref=f4e641]: 外部入出力
          - definition [ref=f4e642]: OUT × 1、IN × 3（3.5 mm 4 極）。デジタルの同時判定とアナログの波高
        - generic [ref=f4e643]:
          - term [ref=f4e644]: オシロスコープ
          - definition [ref=f4e645]: A0 を DMA で 83.3 kHz、1 イベント 161 点。毎秒 1〜20 波形
        - generic [ref=f4e646]:
          - term [ref=f4e647]: 電源
          - definition [ref=f4e648]: USB-C 5 V
        - generic [ref=f4e649]:
          - term [ref=f4e650]: 大きさ
          - definition [ref=f4e651]: 読み出し基板 63 × 63 mm、センサ子基板 40 × 40 mm、ケース 76 × 74 × 71.5 mm
      - paragraph [ref=f4e652]: 数値は回路図（KiCad 9）・ファームウェア（COSMICRAY_DETECTOR_ESP32-S3-Nano-v2）・arduino/description.md・shaping.html による値です。回路の見直しを反映した後継機 v2.1 では、整形段と DAC によるしきい値に置き換えています。この装置は自然の宇宙線を数えるためのもので、線量計としての校正はしていません。
