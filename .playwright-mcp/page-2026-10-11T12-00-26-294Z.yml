        - paragraph [ref=f8e633]: 10 — SPEC
        - heading "仕様" [level=2] [ref=f8e634]
      - generic [ref=f8e635]:
        - generic [ref=f8e636]:
          - term [ref=f8e637]: 検出のしかた
          - definition [ref=f8e638]: シンチレータ ＋ SiPM（onsemi MICROFC-60035-SMT：受光 6 × 6 mm、マイクロセル 35 µm）。SiPM は 40 × 40 mm の子基板に載せ、2×3 ピンで接続
        - generic [ref=f8e639]:
          - term [ref=f8e640]: SiPM バイアス
          - definition [ref=f8e641]: LT3461 昇圧、29.0 V 固定（USB の 5 V から）。子基板で RC フィルタ
        - generic [ref=f8e642]:
          - term [ref=f8e643]: アンプ
          - definition [ref=f8e644]: LT1807（U2A）非反転、×5.0〜×45（R10 で調整）。入力保護 1 kΩ ＋ BAT54S
        - generic [ref=f8e645]:
          - term [ref=f8e646]: ピークホールド
          - definition [ref=f8e647]: LT1807（U2B）＋ ダイオード ＋ C6、アンプ出力の ×2 を保持。放電の時定数は数百 µs（計算 487 µs）。D8 → Q1 で 20 µs 放電
        - generic [ref=f8e648]:
          - term [ref=f8e649]: マイコン
          - definition [ref=f8e650]: Arduino Nano ESP32（ESP32-S3、BLE）。裏面のソケットに差す
        - generic [ref=f8e651]:
          - term [ref=f8e652]: トリガー
          - definition [ref=f8e653]: アナログ。A0（ピークホールドの出力）をソフトでしきい値と比べ、超えたらイベントとして記録。しきい値は起動時に自動で決まり、あとから変えられます
        - generic [ref=f8e654]:
          - term [ref=f8e655]: 波高
          - definition [ref=f8e656]: 12 bit（0〜4095）。トリガーの約 60 µs 後に A0 を 1 回読む
        - generic [ref=f8e657]:
          - term [ref=f8e658]: デッドタイム
          - definition [ref=f8e659]: イベントの処理（約 0.1 ms）、2 秒ごとの OLED 書き換え、オシロ表示中、コマンド実行中。ログに累積値を出力
        - generic [ref=f8e660]:
          - term [ref=f8e661]: 環境センサ
          - definition [ref=f8e662]: BME280（温度・湿度・気圧）、2 秒ごとに更新
        - generic [ref=f8e663]:
          - term [ref=f8e664]: 表示・通知
          - definition [ref=f8e665]: OLED SSD1306 128 × 64、LED、圧電ブザー（500〜4000 Hz）、振動モーター（A7 に後付け、ドライバが必要）
        - generic [ref=f8e666]:
          - term [ref=f8e667]: 記録・通信
          - definition [ref=f8e668]: USB シリアル（9600 bps）、Bluetooth LE（Nordic UART、名前 CosmicRay）、microSD（FAT32、1 行ごとに確定）
        - generic [ref=f8e669]:
          - term [ref=f8e670]: 外部入出力
          - definition [ref=f8e671]: OUT × 1、IN × 3（3.5 mm 4 極）。デジタルの同時判定とアナログの波高
        - generic [ref=f8e672]:
          - term [ref=f8e673]: オシロスコープ
          - definition [ref=f8e674]: A0 を DMA で 83.3 kHz、1 イベント 161 点。毎秒 1〜20 波形
        - generic [ref=f8e675]:
          - term [ref=f8e676]: 電源
          - definition [ref=f8e677]: USB-C 5 V
        - generic [ref=f8e678]:
          - term [ref=f8e679]: 大きさ
          - definition [ref=f8e680]: 読み出し基板 63 × 63 mm、センサ子基板 40 × 40 mm、ケース 76 × 74 × 71.5 mm
      - paragraph [ref=f8e681]: 数値は回路図（KiCad 9）・ファームウェア（COSMICRAY_DETECTOR_ESP32-S3-Nano-v2）・arduino/description.md・shaping.html による値です。回路の見直しを反映した後継機 v2.1 では、整形段と DAC によるしきい値に置き換えています。この装置は自然の宇宙線を数えるためのもので、線量計としての校正はしていません。
