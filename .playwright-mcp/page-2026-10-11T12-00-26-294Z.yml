      - generic [ref=f8e116]:
        - generic [ref=f8e117]:
          - paragraph [ref=f8e118]: 01 — INSIDE
          - heading "部品ごとに、 役割があります。" [level=2] [ref=f8e119]: 部品ごとに、役割があります。
          - paragraph [ref=f8e120]: 光を受けてから記録するまで。カメラが該当する部品へ移動します。
        - article [ref=f8e121]:
          - text: 01 / 10
          - heading "光を受ける シンチレータ × SiPM" [level=3] [ref=f8e122]:
            - text: 光を受ける
            - generic [ref=f8e123]: シンチレータ × SiPM
          - paragraph [ref=f8e124]: ミューオンがシンチレータを通ると、落としたエネルギーの一部が光になります。その光を 6 mm 角の SiPM（onsemi MICROFC-60035）が電気のパルスに変えます。SiPM は 40 mm 角の子基板にのっていて、子基板ごと品種を差し替えられます。
          - list [ref=f8e125]:
            - listitem [ref=f8e126]: マイクロセル 35 µm × 18,980
            - listitem [ref=f8e127]:
              - text: V
              - subscript [ref=f8e128]: br
              - text: 24.2〜24.7 V
            - listitem [ref=f8e129]: J1 / J2：HV・GND・信号 ×2
        - article [ref=f8e130]:
          - text: 02 / 10
          - heading "バイアスをつくる HV 29.0 V" [level=3] [ref=f8e131]:
            - text: バイアスをつくる
            - generic [ref=f8e132]: HV 29.0 V
          - paragraph [ref=f8e133]: 裏面の LT3461 が USB の 5 V から 29.0 V を昇圧してつくり、降伏電圧より 4.3〜4.8 V 高くかけます。値は抵抗の分圧で固定。子基板の 49.9 Ω と 10 µF でノイズを落としてから SiPM に届けます。
          - list [ref=f8e134]:
            - listitem [ref=f8e135]: HV = 1.255 × (1 + 221k / 10k)
            - listitem [ref=f8e136]: L1 47 µH
        - article [ref=f8e137]:
          - text: 03 / 10
          - heading "増幅する LT1807（U2A）" [level=3] [ref=f8e138]:
            - text: 増幅する
            - generic [ref=f8e139]: LT1807（U2A）
          - paragraph [ref=f8e140]: SiPM の電流は子基板の R12（49.9 Ω）で電圧になり、U2A の非反転アンプで増幅されます。ゲインは裏面のトリマ R10 で ×5.0〜×45。入力は 1 kΩ と BAT54S で守られています。アンプの出力は TP2 で測れます。
          - list [ref=f8e141]:
            - listitem [ref=f8e142]: G = 1 + (R5 + R10) / R3
            - listitem [ref=f8e143]: R3 249 Ω・R5 1 kΩ
            - listitem [ref=f8e144]: DC 結合
        - article [ref=f8e145]:
          - text: 04 / 10
          - heading "山の高さをつかむ ピークホールドとしきい値" [level=3] [ref=f8e146]:
            - text: 山の高さをつかむ
            - generic [ref=f8e147]: ピークホールドとしきい値
          - paragraph [ref=f8e148]: U2B のピークホールドが、数百 ns のパルスの山を 2 倍にしてコンデンサ C6 にためます。ためた電圧は A0 に出てきます。マイコンが読み終わると、D8 から 20 µs のパルスを出して Q1 で放電し、次のパルスに備えます。
          - list [ref=f8e149]:
            - listitem [ref=f8e150]: ホールド ×2
            - listitem [ref=f8e151]: A0 に出力
            - listitem [ref=f8e152]: D8 → Q1 で放電
        - article [ref=f8e153]:
          - text: 05 / 10
          - heading "読み取る Arduino Nano ESP32" [level=3] [ref=f8e154]:
            - text: 読み取る
            - generic [ref=f8e155]: Arduino Nano ESP32
          - paragraph [ref=f8e156]: A0（ホールドの出力）を読み続け、しきい値を超えたらイベントとして扱います。外部検出器の同時判定を待ってから A0 を 12 bit で読み、その値が波高になります。しきい値は起動のたびに、A0 を 1 秒見てノイズの最大値 + 50 に自動で合わせます。
          - list [ref=f8e157]:
            - listitem [ref=f8e158]: ESP32-S3・BLE
            - listitem [ref=f8e159]: A0 をソフトで比較
            - listitem [ref=f8e160]: トリガーの約 60 µs 後に読む
        - article [ref=f8e161]:
          - text: 06 / 10
          - heading "残す microSD" [level=3] [ref=f8e162]:
            - text: 残す
            - generic [ref=f8e163]: microSD
          - paragraph [ref=f8e164]:
            - text: FAT32 のカードに
            - code [ref=f8e165]: /LOG0001.TXT
            - text: から順にログを書きます。1 行ごとに書き込みを確定するので、USB を抜いても失うのはせいぜい最後の 1 行。USB と Bluetooth に出すのと同じ行がそのまま残ります。
          - list [ref=f8e166]:
            - listitem [ref=f8e167]: Hirose DM3AT
            - listitem [ref=f8e168]: SPI 4 MHz
            - listitem [ref=f8e169]: 背面から差す
        - article [ref=f8e170]:
          - text: 07 / 10
          - heading "環境を測る BME280" [level=3] [ref=f8e171]:
            - text: 環境を測る
            - generic [ref=f8e172]: BME280
          - paragraph [ref=f8e173]: 温度・湿度・気圧を 2 秒ごとに読み、各イベントの行に書きます。気圧が上がると計数率が下がる「気圧効果」を調べられます。SiPM の降伏電圧は 1 °C あたり約 21.5 mV 変わるので、温度はあとで波高を見直すときにも使います。
          - list [ref=f8e174]:
            - listitem [ref=f8e175]: I²C
            - listitem [ref=f8e176]: 温度・湿度・気圧
        - article [ref=f8e177]:
          - text: 08 / 10
          - heading "知らせる OLED・LED・ブザー" [level=3] [ref=f8e178]:
            - text: 知らせる
            - generic [ref=f8e179]: OLED・LED・ブザー
          - paragraph [ref=f8e180]: 基板の端に立てた 0.96 インチ OLED に、計数・計数率・しきい値・環境値を 2 秒ごとに表示。イベントごとに LED が光り、ブザーが波高に応じた高さで「ピッ」と鳴ります（対数で 500〜4000 Hz）。A7 に振動モーターを後付けすると、大きなパルスほど長く震えます。
          - list [ref=f8e181]:
            - listitem [ref=f8e182]: SSD1306 128 × 64
            - listitem [ref=f8e183]: 25 ms のビープ
            - listitem [ref=f8e184]: 振動 20〜120 ms
        - article [ref=f8e185]:
          - text: 09 / 10
          - heading "つなぐ 3.5 mm ジャック × 4" [level=3] [ref=f8e186]:
            - text: つなぐ
            - generic [ref=f8e187]: 3.5 mm ジャック × 4
          - paragraph [ref=f8e188]: OUT が 1 つ、IN が 3 つ。自分がトリガーすると COIN_OUT（3.3 V・100 µs）を出し、50 µs 待ってから相手の COIN_OUT を読みます。相手もほぼ同時に反応していれば、そのジャックの列が 1 になります。アナログの波高も読めます。
          - list [ref=f8e189]:
            - listitem [ref=f8e190]: TRRS ケーブル
            - listitem [ref=f8e191]: 最大 4 台
            - listitem [ref=f8e192]: 同時の窓 約 ±50 µs
        - article [ref=f8e193]:
          - text: 10 / 10
          - heading "包む 3D プリントのケース" [level=3] [ref=f8e194]:
            - text: 包む
            - generic [ref=f8e195]: 3D プリントのケース
          - paragraph [ref=f8e196]:
            - text: ケース本体は前面だけが閉じた箱で、基板の組を背面から差し込み、厚さ 1 mm の背面板で閉じます。前面に OLED の窓とボタン、側面にジャック 4 つ、背面に USB-C と microSD。STL は
            - code [ref=f8e197]: cad/
            - text: にあります。
          - list [ref=f8e198]:
            - listitem [ref=f8e199]: FDM 印刷
            - listitem [ref=f8e200]: 76 × 74 × 71.5 mm
            - listitem [ref=f8e201]: 背面板 ねじ 4 本
