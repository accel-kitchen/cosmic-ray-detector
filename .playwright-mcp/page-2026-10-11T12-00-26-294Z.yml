        - paragraph [ref=f8e237]: SCINTILLATOR
        - heading "シンチレータは、 2 種類から選べます。" [level=2] [ref=f8e238]: シンチレータは、2 種類から選べます。
        - paragraph [ref=f8e239]: 基板もケースも同じで、光を出す部分だけが違います。広く集めたいか、小さく持ち運びたいかで選べます。
      - list [ref=f8e240]:
        - listitem [ref=f8e241]:
          - text: プラスチックシンチレータ版
          - generic [ref=f8e244]: 5 cm × 5 cm × 1 cm
          - paragraph [ref=f8e245]: 板のように広い形です。受ける面積が 25 cm² あるので、宇宙線にたくさん当たります。短い時間でも数が集まり、計数率の変化を追いたいときや、2 台を重ねたコインシデンスに向きます。
          - figure "取れるスペクトル 光の弱い側にガンマ線（身のまわりの放射線）、強い側に宇宙線（宇宙から降ってくる放射線）の山。宇宙線だけを選んで数えられます。" [ref=f8e246]:
            - img "プラスチックシンチレータで取ったスペクトル。光の弱い側にガンマ線、強い側に宇宙線の山が分かれて見える" [ref=f8e247]
            - generic [ref=f8e248]:
              - generic [ref=f8e249]: 取れるスペクトル
              - text: 光の弱い側にガンマ線（身のまわりの放射線）、強い側に宇宙線（宇宙から降ってくる放射線）の山。宇宙線だけを選んで数えられます。
        - listitem [ref=f8e250]:
          - text: CsI シンチレータ版
          - generic [ref=f8e253]: 1 cm 立方
          - paragraph [ref=f8e254]: サイコロのように小さな形です。コンパクトで、持ち運びや狭い場所への設置に向きます。受ける面積が小さいぶん、数えられる宇宙線の数は少なめです。
          - figure "取れるスペクトル（花崗岩を測定） ガンマ線のエネルギーごとに山が立ちます。花崗岩にふくまれるウランやトリウムが崩れていく途中でできる Pb-214、Tl-208、Ac-228 が出したガンマ線が、山の位置から読み取れます。" [ref=f8e255]:
            - img "CsI 検出器で花崗岩を測ったガンマ線のスペクトル。いくつかの山があり、その位置から Pb-214、Tl-208、Ac-228 が出したガンマ線だと分かる" [ref=f8e256]
            - generic [ref=f8e257]:
              - generic [ref=f8e258]: 取れるスペクトル（花崗岩を測定）
