    - generic [ref=f1e255]:
      - generic [ref=f1e256]:
        - paragraph [ref=f1e257]: 03 — PHYSICS
        - heading "宇宙線を数えるしくみ" [level=2] [ref=f1e258]
        - list [ref=f1e259]:
          - listitem [ref=f1e260]:
            - generic [ref=f1e261]: ①
            - generic [ref=f1e262]:
              - text: 通過
              - paragraph: 一次宇宙線（主に陽子）が大気の上のほうで原子核とぶつかり、粒子のシャワーをつくります。地上に届くのはほとんどがミューオン。海抜 0 m で 1 cm² あたり毎分およそ 1 個です。
          - listitem [ref=f1e263]:
            - generic [ref=f1e264]: ②
            - generic [ref=f1e265]:
              - text: 発光
              - paragraph: ミューオンはシンチレータを通るあいだにエネルギーを落とし、その一部が光になります。GAGG:Ce なら 6 mm で約 6 MeV（緑の光）、プラスチックなら 1 cm で約 2 MeV（青い光）。
          - listitem [ref=f1e266]:
            - generic [ref=f1e267]: ③
            - generic [ref=f1e268]:
              - text: SiPM
              - paragraph: 35 µm のマイクロセルが 18,980 個並んだ SiPM。光子が当たったセルで、なだれ増倍が起きます。
          - listitem [ref=f1e269]:
            - generic [ref=f1e270]: ④
            - generic [ref=f1e271]:
              - text: パルス
              - paragraph: 子基板の R12（49.9 Ω）で電圧になります。数百 ns の速いパルスです。
          - listitem [ref=f1e272]:
            - generic [ref=f1e273]: ⑤
            - generic [ref=f1e274]:
              - text: 増幅・ホールド
              - paragraph: ×5〜×45 に増幅し、ピークホールドが山の高さを 2 倍にしてためます。A0 の電圧がしきい値を超えたら、イベントとして読み取ります。
          - listitem [ref=f1e275]:
            - generic [ref=f1e276]: ⑥
            - generic [ref=f1e277]:
              - text: 記録
              - paragraph [ref=f1e278]: トリガーの約 60 µs 後に A0 を 12 bit で読み、時刻・環境値と一緒に 1 行で出します。読み終えたら D8 でホールドを空にします。
      - generic "宇宙線が記録されるまでのアニメーション" [ref=f1e280]
