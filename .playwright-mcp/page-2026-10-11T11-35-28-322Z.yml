      - generic [ref=f1e113]:
        - generic [ref=f1e114]:
          - paragraph [ref=f1e115]: 01 — INSIDE
          - heading "部品ごとに、 役割があります。" [level=2] [ref=f1e116]: 部品ごとに、役割があります。
          - paragraph [ref=f1e117]: 光を受けてから記録するまで。カメラが該当する部品へ移動します。
        - article [ref=f1e118]:
          - text: 01 / 10
          - heading "光を受ける シンチレータ × SiPM" [level=3] [ref=f1e119]:
            - text: 光を受ける
            - generic [ref=f1e120]: シンチレータ × SiPM
          - paragraph [ref=f1e121]: ミューオンがシンチレータを通ると、落としたエネルギーの一部が光になります。その光を 6 mm 角の SiPM（onsemi MICROFC-60035）が電気のパルスに変えます。SiPM は 40 mm 角の子基板にのっていて、子基板ごと品種を差し替えられます。
          - list [ref=f1e122]:
            - listitem [ref=f1e123]: マイクロセル 35 µm × 18,980
            - listitem [ref=f1e124]:
              - text: V
              - subscript [ref=f1e125]: br
              - text: 24.2〜24.7 V
            - listitem [ref=f1e126]: J1 / J2：HV・GND・信号 ×2
        - article [ref=f1e127]:
          - text: 02 / 10
          - heading "バイアスをつくる HV 29.0 V" [level=3] [ref=f1e128]:
            - text: バイアスをつくる
            - generic [ref=f1e129]: HV 29.0 V
          - paragraph [ref=f1e130]: 裏面の LT3461 が USB の 5 V から 29.0 V を昇圧してつくり、降伏電圧より 4.3〜4.8 V 高くかけます。値は抵抗の分圧で固定。子基板の 49.9 Ω と 10 µF でノイズを落としてから SiPM に届けます。
          - list [ref=f1e131]:
            - listitem [ref=f1e132]: HV = 1.255 × (1 + 221k / 10k)
            - listitem [ref=f1e133]: L1 47 µH
        - article [ref=f1e134]:
          - text: 03 / 10
          - heading "増幅する LT1807（U2A）" [level=3] [ref=f1e135]:
            - text: 増幅する
            - generic [ref=f1e136]: LT1807（U2A）
          - paragraph [ref=f1e137]: SiPM の電流は子基板の R12（49.9 Ω）で電圧になり、U2A の非反転アンプで増幅されます。ゲインは裏面のトリマ R10 で ×5.0〜×45。入力は 1 kΩ と BAT54S で守られています。アンプの出力は TP2 で測れます。
          - list [ref=f1e138]:
            - listitem [ref=f1e139]: G = 1 + (R5 + R10) / R3
            - listitem [ref=f1e140]: R3 249 Ω・R5 1 kΩ
            - listitem [ref=f1e141]: DC 結合
        - article [ref=f1e142]:
          - text: 04 / 10
          - heading "山の高さをつかむ ピークホールドとしきい値" [level=3] [ref=f1e143]:
            - text: 山の高さをつかむ
            - generic [ref=f1e144]: ピークホールドとしきい値
          - paragraph [ref=f1e145]: U2B のピークホールドが、数百 ns のパルスの山を 2 倍にしてコンデンサ C6 にためます。ためた電圧は A0 に出てきます。マイコンが読み終わると、D8 から 20 µs のパルスを出して Q1 で放電し、次のパルスに備えます。
          - list [ref=f1e146]:
            - listitem [ref=f1e147]: ホールド ×2
            - listitem [ref=f1e148]: A0 に出力
            - listitem [ref=f1e149]: D8 → Q1 で放電
        - article [ref=f1e150]:
          - text: 05 / 10
          - heading "読み取る Arduino Nano ESP32" [level=3] [ref=f1e151]:
            - text: 読み取る
            - generic [ref=f1e152]: Arduino Nano ESP32
          - paragraph [ref=f1e153]: A0（ホールドの出力）を読み続け、しきい値を超えたらイベントとして扱います。外部検出器の同時判定を待ってから A0 を 12 bit で読み、その値が波高になります。しきい値は起動のたびに、A0 を 1 秒見てノイズの最大値 + 50 に自動で合わせます。
          - list [ref=f1e154]:
            - listitem [ref=f1e155]: ESP32-S3・BLE
            - listitem [ref=f1e156]: A0 をソフトで比較
            - listitem [ref=f1e157]: トリガーの約 60 µs 後に読む
        - article [ref=f1e158]:
          - text: 06 / 10
          - heading "残す microSD" [level=3] [ref=f1e159]:
            - text: 残す
            - generic [ref=f1e160]: microSD
          - paragraph [ref=f1e161]:
            - text: FAT32 のカードに
            - code [ref=f1e162]: /LOG0001.TXT
            - text: から順にログを書きます。1 行ごとに書き込みを確定するので、USB を抜いても失うのはせいぜい最後の 1 行。USB と Bluetooth に出すのと同じ行がそのまま残ります。
          - list [ref=f1e163]:
            - listitem [ref=f1e164]: Hirose DM3AT
            - listitem [ref=f1e165]: SPI 4 MHz
            - listitem [ref=f1e166]: 背面から差す
        - article [ref=f1e167]:
          - text: 07 / 10
          - heading "環境を測る BME280" [level=3] [ref=f1e168]:
            - text: 環境を測る
            - generic [ref=f1e169]: BME280
          - paragraph [ref=f1e170]: 温度・湿度・気圧を 2 秒ごとに読み、各イベントの行に書きます。気圧が上がると計数率が下がる「気圧効果」を調べられます。SiPM の降伏電圧は 1 °C あたり約 21.5 mV 変わるので、温度はあとで波高を見直すときにも使います。
          - list [ref=f1e171]:
            - listitem [ref=f1e172]: I²C
            - listitem [ref=f1e173]: 温度・湿度・気圧
        - article [ref=f1e174]:
          - text: 08 / 10
          - heading "知らせる OLED・LED・ブザー" [level=3] [ref=f1e175]:
            - text: 知らせる
            - generic [ref=f1e176]: OLED・LED・ブザー
          - paragraph [ref=f1e177]: 基板の端に立てた 0.96 インチ OLED に、計数・計数率・しきい値・環境値を 2 秒ごとに表示。イベントごとに LED が光り、ブザーが波高に応じた高さで「ピッ」と鳴ります（対数で 500〜4000 Hz）。A7 に振動モーターを後付けすると、大きなパルスほど長く震えます。
          - list [ref=f1e178]:
            - listitem [ref=f1e179]: SSD1306 128 × 64
            - listitem [ref=f1e180]: 25 ms のビープ
            - listitem [ref=f1e181]: 振動 20〜120 ms
        - article [ref=f1e182]:
          - text: 09 / 10
          - heading "つなぐ 3.5 mm ジャック × 4" [level=3] [ref=f1e183]:
            - text: つなぐ
            - generic [ref=f1e184]: 3.5 mm ジャック × 4
          - paragraph [ref=f1e185]: OUT が 1 つ、IN が 3 つ。自分がトリガーすると COIN_OUT（3.3 V・100 µs）を出し、50 µs 待ってから相手の COIN_OUT を読みます。相手もほぼ同時に反応していれば、そのジャックの列が 1 になります。アナログの波高も読めます。
          - list [ref=f1e186]:
            - listitem [ref=f1e187]: TRRS ケーブル
            - listitem [ref=f1e188]: 最大 4 台
            - listitem [ref=f1e189]: 同時の窓 約 ±50 µs
        - article [ref=f1e190]:
          - text: 10 / 10
          - heading "包む 3D プリントのケース" [level=3] [ref=f1e191]:
            - text: 包む
            - generic [ref=f1e192]: 3D プリントのケース
          - paragraph [ref=f1e193]:
            - text: ケース本体は前面だけが閉じた箱で、基板の組を背面から差し込み、厚さ 1 mm の背面板で閉じます。前面に OLED の窓とボタン、側面にジャック 4 つ、背面に USB-C と microSD。STL は
            - code [ref=f1e194]: cad/
            - text: にあります。
          - list [ref=f1e195]:
            - listitem [ref=f1e196]: FDM 印刷
            - listitem [ref=f1e197]: 76 × 74 × 71.5 mm
            - listitem [ref=f1e198]: 背面板 ねじ 4 本
