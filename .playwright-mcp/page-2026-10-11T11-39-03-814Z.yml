      - generic [ref=f2e284]:
        - paragraph [ref=f2e285]: 03 — PHYSICS
        - heading "宇宙線を数えるしくみ" [level=2] [ref=f2e286]
        - list [ref=f2e287]:
          - listitem [ref=f2e288]:
            - generic [ref=f2e289]: ①
            - generic [ref=f2e290]:
              - text: 通過
              - paragraph [ref=f2e291]: 一次宇宙線（主に陽子）が大気の上のほうで原子核とぶつかり、粒子のシャワーをつくります。地上に届くのはほとんどがミューオン。海抜 0 m で 1 cm² あたり毎分およそ 1 個です。
          - listitem [ref=f2e292]:
            - generic [ref=f2e293]: ②
