      - generic [ref=f2e235]:
        - paragraph [ref=f2e236]: SCINTILLATOR
        - heading "シンチレータは、 2 種類から選べます。" [level=2] [ref=f2e237]: シンチレータは、2 種類から選べます。
        - paragraph [ref=f2e238]: 基板もケースも同じで、光を出す部分だけが違います。広く集めたいか、小さく持ち運びたいかで選べます。
      - list [ref=f2e239]:
        - listitem [ref=f2e240]:
          - text: プラスチックシンチレータ版
          - generic [ref=f2e243]: 5 cm × 5 cm × 1 cm
          - paragraph [ref=f2e244]: 板のように広い形です。受ける面積が 25 cm² あるので、宇宙線にたくさん当たります。短い時間でも数が集まり、計数率の変化を追いたいときや、2 台を重ねたコインシデンスに向きます。
          - figure "取れるスペクトル 光の弱い側にガンマ線（身のまわりの放射線）、強い側に宇宙線（宇宙から降ってくる放射線）の山。宇宙線だけを選んで数えられます。" [ref=f2e245]:
            - img "プラスチックシンチレータで取ったスペクトル。光の弱い側にガンマ線、強い側に宇宙線の山が分かれて見える" [ref=f2e246]
            - generic [ref=f2e247]:
              - generic [ref=f2e248]: 取れるスペクトル
              - text: 光の弱い側にガンマ線（身のまわりの放射線）、強い側に宇宙線（宇宙から降ってくる放射線）の山。宇宙線だけを選んで数えられます。
        - listitem [ref=f2e249]:
          - text: CsI シンチレータ版
          - generic [ref=f2e252]: 1 cm 立方
          - paragraph [ref=f2e253]: サイコロのように小さな形です。コンパクトで、持ち運びや狭い場所への設置に向きます。受ける面積が小さいぶん、数えられる宇宙線の数は少なめです。
          - figure "取れるスペクトル ガンマ線のエネルギーごとに山が立ちます。山の位置から、鉛・タリウム・アクチニウムが出したガンマ線だと分かります。" [ref=f2e254]:
