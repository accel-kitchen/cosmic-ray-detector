      - generic [ref=f2e115]:
        - generic [ref=f2e116]:
          - paragraph [ref=f2e117]: 01 — INSIDE
          - heading "部品ごとに、 役割があります。" [level=2] [ref=f2e118]: 部品ごとに、役割があります。
          - paragraph [ref=f2e119]: 光を受けてから記録するまで。カメラが該当する部品へ移動します。
        - article [ref=f2e120]:
          - text: 01 / 10
          - heading "光を受ける シンチレータ × SiPM" [level=3] [ref=f2e121]:
            - text: 光を受ける
            - generic [ref=f2e122]: シンチレータ × SiPM
          - paragraph [ref=f2e123]: ミューオンがシンチレータを通ると、落としたエネルギーの一部が光になります。その光を 6 mm 角の SiPM（onsemi MICROFC-60035）が電気のパルスに変えます。SiPM は 40 mm 角の子基板にのっていて、子基板ごと品種を差し替えられます。
          - list [ref=f2e124]:
            - listitem [ref=f2e125]: マイクロセル 35 µm × 18,980
            - listitem [ref=f2e126]:
              - text: V
              - subscript [ref=f2e127]: br
              - text: 24.2〜24.7 V
            - listitem [ref=f2e128]: J1 / J2：HV・GND・信号 ×2
        - article [ref=f2e129]:
          - text: 02 / 10
          - heading "バイアスをつくる HV 29.0 V" [level=3] [ref=f2e130]:
            - text: バイアスをつくる
            - generic [ref=f2e131]: HV 29.0 V
          - paragraph [ref=f2e132]: 裏面の LT3461 が USB の 5 V から 29.0 V を昇圧してつくり、降伏電圧より 4.3〜4.8 V 高くかけます。値は抵抗の分圧で固定。子基板の 49.9 Ω と 10 µF でノイズを落としてから SiPM に届けます。
          - list [ref=f2e133]:
            - listitem [ref=f2e134]: HV = 1.255 × (1 + 221k / 10k)
            - listitem [ref=f2e135]: L1 47 µH
        - article [ref=f2e136]:
          - text: 03 / 10
          - heading "増幅する LT1807（U2A）" [level=3] [ref=f2e137]:
            - text: 増幅する
            - generic [ref=f2e138]: LT1807（U2A）
          - paragraph [ref=f2e139]: SiPM の電流は子基板の R12（49.9 Ω）で電圧になり、U2A の非反転アンプで増幅されます。ゲインは裏面のトリマ R10 で ×5.0〜×45。入力は 1 kΩ と BAT54S で守られています。アンプの出力は TP2 で測れます。
          - list [ref=f2e140]:
            - listitem [ref=f2e141]: G = 1 + (R5 + R10) / R3
            - listitem [ref=f2e142]: R3 249 Ω・R5 1 kΩ
            - listitem [ref=f2e143]: DC 結合
        - article [ref=f2e144]:
          - text: 04 / 10
          - heading "山の高さをつかむ ピークホールドとしきい値" [level=3] [ref=f2e145]:
            - text: 山の高さをつかむ
            - generic [ref=f2e146]: ピークホールドとしきい値
          - paragraph [ref=f2e147]: U2B のピークホールドが、数百 ns のパルスの山を 2 倍にしてコンデンサ C6 にためます。ためた電圧は A0 に出てきます。マイコンが読み終わると、D8 から 20 µs のパルスを出して Q1 で放電し、次のパルスに備えます。
          - list [ref=f2e148]:
            - listitem [ref=f2e149]: ホールド ×2
            - listitem [ref=f2e150]: A0 に出力
            - listitem [ref=f2e151]: D8 → Q1 で放電
        - article [ref=f2e152]:
          - text: 05 / 10
          - heading "読み取る Arduino Nano ESP32" [level=3] [ref=f2e153]:
            - text: 読み取る
            - generic [ref=f2e154]: Arduino Nano ESP32
          - paragraph [ref=f2e155]: A0（ホールドの出力）を読み続け、しきい値を超えたらイベントとして扱います。外部検出器の同時判定を待ってから A0 を 12 bit で読み、その値が波高になります。しきい値は起動のたびに、A0 を 1 秒見てノイズの最大値 + 50 に自動で合わせます。
          - list [ref=f2e156]:
            - listitem [ref=f2e157]: ESP32-S3・BLE
            - listitem [ref=f2e158]: A0 をソフトで比較
            - listitem [ref=f2e159]: トリガーの約 60 µs 後に読む
        - article [ref=f2e160]:
          - text: 06 / 10
          - heading "残す microSD" [level=3] [ref=f2e161]:
            - text: 残す
            - generic [ref=f2e162]: microSD
          - paragraph [ref=f2e163]:
            - text: FAT32 のカードに
            - code [ref=f2e164]: /LOG0001.TXT
            - text: から順にログを書きます。1 行ごとに書き込みを確定するので、USB を抜いても失うのはせいぜい最後の 1 行。USB と Bluetooth に出すのと同じ行がそのまま残ります。
          - list [ref=f2e165]:
            - listitem [ref=f2e166]: Hirose DM3AT
            - listitem [ref=f2e167]: SPI 4 MHz
            - listitem [ref=f2e168]: 背面から差す
        - article [ref=f2e169]:
          - text: 07 / 10
          - heading "環境を測る BME280" [level=3] [ref=f2e170]:
            - text: 環境を測る
            - generic [ref=f2e171]: BME280
          - paragraph [ref=f2e172]: 温度・湿度・気圧を 2 秒ごとに読み、各イベントの行に書きます。気圧が上がると計数率が下がる「気圧効果」を調べられます。SiPM の降伏電圧は 1 °C あたり約 21.5 mV 変わるので、温度はあとで波高を見直すときにも使います。
          - list [ref=f2e173]:
            - listitem [ref=f2e174]: I²C
            - listitem [ref=f2e175]: 温度・湿度・気圧
        - article [ref=f2e176]:
          - text: 08 / 10
          - heading "知らせる OLED・LED・ブザー" [level=3] [ref=f2e177]:
            - text: 知らせる
            - generic [ref=f2e178]: OLED・LED・ブザー
          - paragraph [ref=f2e179]: 基板の端に立てた 0.96 インチ OLED に、計数・計数率・しきい値・環境値を 2 秒ごとに表示。イベントごとに LED が光り、ブザーが波高に応じた高さで「ピッ」と鳴ります（対数で 500〜4000 Hz）。A7 に振動モーターを後付けすると、大きなパルスほど長く震えます。
          - list [ref=f2e180]:
            - listitem [ref=f2e181]: SSD1306 128 × 64
            - listitem [ref=f2e182]: 25 ms のビープ
            - listitem [ref=f2e183]: 振動 20〜120 ms
        - article [ref=f2e184]:
          - text: 09 / 10
          - heading "つなぐ 3.5 mm ジャック × 4" [level=3] [ref=f2e185]:
            - text: つなぐ
            - generic [ref=f2e186]: 3.5 mm ジャック × 4
          - paragraph [ref=f2e187]: OUT が 1 つ、IN が 3 つ。自分がトリガーすると COIN_OUT（3.3 V・100 µs）を出し、50 µs 待ってから相手の COIN_OUT を読みます。相手もほぼ同時に反応していれば、そのジャックの列が 1 になります。アナログの波高も読めます。
          - list [ref=f2e188]:
            - listitem [ref=f2e189]: TRRS ケーブル
            - listitem [ref=f2e190]: 最大 4 台
            - listitem [ref=f2e191]: 同時の窓 約 ±50 µs
        - article [ref=f2e192]:
          - text: 10 / 10
          - heading "包む 3D プリントのケース" [level=3] [ref=f2e193]:
            - text: 包む
            - generic [ref=f2e194]: 3D プリントのケース
          - paragraph [ref=f2e195]:
            - text: ケース本体は前面だけが閉じた箱で、基板の組を背面から差し込み、厚さ 1 mm の背面板で閉じます。前面に OLED の窓とボタン、側面にジャック 4 つ、背面に USB-C と microSD。STL は
            - code [ref=f2e196]: cad/
            - text: にあります。
          - list [ref=f2e197]:
            - listitem [ref=f2e198]: FDM 印刷
            - listitem [ref=f2e199]: 76 × 74 × 71.5 mm
            - listitem [ref=f2e200]: 背面板 ねじ 4 本
