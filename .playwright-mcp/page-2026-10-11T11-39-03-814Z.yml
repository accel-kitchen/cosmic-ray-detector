          - definition [ref=f2e618]: LT1807（U2B）＋ ダイオード ＋ C6、アンプ出力の ×2 を保持。放電の時定数は数百 µs（計算 487 µs）。D8 → Q1 で 20 µs 放電
        - generic [ref=f2e619]:
          - term [ref=f2e620]: マイコン
          - definition [ref=f2e621]: Arduino Nano ESP32（ESP32-S3、BLE）。裏面のソケットに差す
        - generic [ref=f2e622]:
          - term [ref=f2e623]: トリガー
          - definition [ref=f2e624]: アナログ。A0（ピークホールドの出力）をソフトでしきい値と比べ、超えたらイベントとして記録。しきい値は起動時に自動で決まり、あとから変えられます
        - generic [ref=f2e625]:
          - term [ref=f2e626]: 波高
          - definition [ref=f2e627]: 12 bit（0〜4095）。トリガーの約 60 µs 後に A0 を 1 回読む
        - generic [ref=f2e628]:
          - term [ref=f2e629]: デッドタイム
          - definition [ref=f2e630]: イベントの処理（約 0.1 ms）、2 秒ごとの OLED 書き換え、オシロ表示中、コマンド実行中。ログに累積値を出力
        - generic [ref=f2e631]:
          - term [ref=f2e632]: 環境センサ
          - definition [ref=f2e633]: BME280（温度・湿度・気圧）、2 秒ごとに更新
        - generic [ref=f2e634]:
          - term [ref=f2e635]: 表示・通知
          - definition [ref=f2e636]: OLED SSD1306 128 × 64、LED、圧電ブザー（500〜4000 Hz）、振動モーター（A7 に後付け、ドライバが必要）
        - generic [ref=f2e637]:
          - term [ref=f2e638]: 記録・通信
          - definition [ref=f2e639]: USB シリアル（9600 bps）、Bluetooth LE（Nordic UART、名前 CosmicRay）、microSD（FAT32、1 行ごとに確定）
        - generic [ref=f2e640]:
          - term [ref=f2e641]: 外部入出力
          - definition [ref=f2e642]: OUT × 1、IN × 3（3.5 mm 4 極）。デジタルの同時判定とアナログの波高
        - generic [ref=f2e643]:
          - term [ref=f2e644]: オシロスコープ
          - definition [ref=f2e645]: A0 を DMA で 83.3 kHz、1 イベント 161 点。毎秒 1〜20 波形
        - generic [ref=f2e646]:
          - term [ref=f2e647]: 電源
          - definition [ref=f2e648]: USB-C 5 V
        - generic [ref=f2e649]:
          - term [ref=f2e650]: 大きさ
          - definition [ref=f2e651]: 読み出し基板 63 × 63 mm、センサ子基板 40 × 40 mm、ケース 76 × 74 × 71.5 mm
      - paragraph [ref=f2e652]: 数値は回路図（KiCad 9）・ファームウェア（COSMICRAY_DETECTOR_ESP32-S3-Nano-v2）・arduino/description.md・shaping.html による値です。回路の見直しを反映した後継機 v2.1 では、整形段と DAC によるしきい値に置き換えています。この装置は自然の宇宙線を数えるためのもので、線量計としての校正はしていません。
