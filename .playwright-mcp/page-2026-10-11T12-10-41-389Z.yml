    - generic [ref=f9e627]:
      - generic [ref=f9e628]:
        - paragraph [ref=f9e629]: 10 — SPEC
        - heading "仕様" [level=2] [ref=f9e630]
      - generic [ref=f9e631]:
        - generic [ref=f9e632]:
          - term [ref=f9e633]: 検出のしかた
          - definition [ref=f9e634]: シンチレータ ＋ SiPM（onsemi MICROFC-60035-SMT：受光 6 × 6 mm、マイクロセル 35 µm）。SiPM は 40 × 40 mm の子基板に載せ、2×3 ピンで接続
        - generic [ref=f9e635]:
          - term [ref=f9e636]: SiPM バイアス
          - definition [ref=f9e637]: LT3461 昇圧、29.0 V 固定（USB の 5 V から）。子基板で RC フィルタ
        - generic [ref=f9e638]:
          - term [ref=f9e639]: アンプ
          - definition [ref=f9e640]: LT1807（U2A）非反転、×5.0〜×45（R10 で調整）。入力保護 1 kΩ ＋ BAT54S
        - generic [ref=f9e641]:
          - term [ref=f9e642]: ピークホールド
          - definition [ref=f9e643]: LT1807（U2B）＋ ダイオード ＋ C6、アンプ出力の ×2 を保持。放電の時定数は数百 µs（計算 487 µs）。D8 → Q1 で 20 µs 放電
        - generic [ref=f9e644]:
          - term [ref=f9e645]: マイコン
          - definition [ref=f9e646]: Arduino Nano ESP32（ESP32-S3、BLE）。裏面のソケットに差す
        - generic [ref=f9e647]:
          - term [ref=f9e648]: トリガー
          - definition [ref=f9e649]: アナログ。A0（ピークホールドの出力）をソフトでしきい値と比べ、超えたらイベントとして記録。しきい値は起動時に自動で決まり、あとから変えられます
        - generic [ref=f9e650]:
          - term [ref=f9e651]: 波高
          - definition [ref=f9e652]: 12 bit（0〜4095）。トリガーの約 60 µs 後に A0 を 1 回読む
        - generic [ref=f9e653]:
          - term [ref=f9e654]: デッドタイム
          - definition [ref=f9e655]: イベントの処理（約 0.1 ms）、2 秒ごとの OLED 書き換え、オシロ表示中、コマンド実行中。ログに累積値を出力
        - generic [ref=f9e656]:
          - term [ref=f9e657]: 環境センサ
          - definition [ref=f9e658]: BME280（温度・湿度・気圧）、2 秒ごとに更新
        - generic [ref=f9e659]:
          - term [ref=f9e660]: 表示・通知
          - definition [ref=f9e661]: OLED SSD1306 128 × 64、LED、圧電ブザー（500〜4000 Hz）、振動モーター（A7 に後付け、ドライバが必要）
        - generic [ref=f9e662]:
          - term [ref=f9e663]: 記録・通信
          - definition [ref=f9e664]: USB シリアル（9600 bps）、Bluetooth LE（Nordic UART、名前 CosmicRay）、microSD（FAT32、1 行ごとに確定）
        - generic [ref=f9e665]:
          - term [ref=f9e666]: 外部入出力
          - definition [ref=f9e667]: OUT × 1、IN × 3（3.5 mm 4 極）。デジタルの同時判定とアナログの波高
        - generic [ref=f9e668]:
          - term [ref=f9e669]: オシロスコープ
          - definition [ref=f9e670]: A0 を DMA で 83.3 kHz、1 イベント 161 点。毎秒 1〜20 波形
        - generic [ref=f9e671]:
          - term [ref=f9e672]: 電源
          - definition [ref=f9e673]: USB-C 5 V
        - generic [ref=f9e674]:
          - term [ref=f9e675]: 大きさ
          - definition [ref=f9e676]: 読み出し基板 63 × 63 mm、センサ子基板 40 × 40 mm、ケース 86 × 75 × 61.4 mm
      - paragraph [ref=f9e677]: 数値は回路図（KiCad 9）・ファームウェア（COSMICRAY_DETECTOR_ESP32-S3-Nano-v2）・arduino/description.md・shaping.html による値です。回路の見直しを反映した後継機 v2.1 では、整形段と DAC によるしきい値に置き換えています。この装置は自然の宇宙線を数えるためのもので、線量計としての校正はしていません。
