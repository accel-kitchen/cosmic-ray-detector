        - list [ref=e289]:
          - listitem [ref=e290]:
            - generic [ref=e291]: ①
            - generic [ref=e292]:
              - text: 通過
              - paragraph [ref=e293]: 一次宇宙線（主に陽子）が大気の上のほうで原子核とぶつかり、粒子のシャワーをつくります。地上に届くのはほとんどがミューオン。海抜 0 m で 1 cm² あたり毎分およそ 1 個です。
          - listitem [ref=e294]:
            - generic [ref=e295]: ②
            - generic [ref=e296]:
              - text: 発光
              - paragraph: ミューオンはシンチレータを通るあいだにエネルギーを落とし、その一部が光になります。GAGG:Ce なら 6 mm で約 6 MeV（緑の光）、プラスチックなら 1 cm で約 2 MeV（青い光）。
          - listitem [ref=e297]:
            - generic [ref=e298]: ③
            - generic [ref=e299]:
              - text: SiPM
              - paragraph: 35 µm のマイクロセルが 18,980 個並んだ SiPM。光子が当たったセルで、なだれ増倍が起きます。
          - listitem [ref=e300]:
            - generic [ref=e301]: ④
            - generic [ref=e302]:
              - text: パルス
              - paragraph: 子基板の R12（49.9 Ω）で電圧になります。数百 ns の速いパルスです。
          - listitem [ref=e303]:
            - generic [ref=e304]: ⑤
            - generic [ref=e305]:
              - text: 増幅・ホールド
              - paragraph: ×5〜×45 に増幅し、ピークホールドが山の高さを 2 倍にしてためます。A0 の電圧がしきい値を超えたら、イベントとして読み取ります。
          - listitem [ref=e306]:
            - generic [ref=e307]: ⑥
            - generic [ref=e308]:
              - text: 記録
              - paragraph: トリガーの約 60 µs 後に A0 を 12 bit で読み、時刻・環境値と一緒に 1 行で出します。読み終えたら D8 でホールドを空にします。
      - generic "宇宙線が記録されるまでのアニメーション" [ref=e310]
