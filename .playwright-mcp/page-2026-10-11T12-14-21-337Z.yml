      - generic [ref=f12e112]:
        - generic [ref=f12e113]:
          - paragraph [ref=f12e114]: 01 — INSIDE
          - heading "部品ごとに、 役割があります。" [level=2] [ref=f12e115]: 部品ごとに、役割があります。
          - paragraph [ref=f12e116]: 光を受けてから記録するまで。カメラが該当する部品へ移動します。
        - article [ref=f12e117]:
          - text: 01 / 10
          - heading "光を受ける シンチレータ × SiPM" [level=3] [ref=f12e118]:
            - text: 光を受ける
            - generic [ref=f12e119]: シンチレータ × SiPM
          - paragraph [ref=f12e120]: ミューオンがシンチレータを通ると、落としたエネルギーの一部が光になります。その光を 6 mm 角の SiPM（onsemi MICROFC-60035）が電気のパルスに変えます。SiPM は 40 mm 角の子基板にのっていて、子基板ごと品種を差し替えられます。
          - list [ref=f12e121]:
            - listitem [ref=f12e122]: マイクロセル 35 µm × 18,980
            - listitem [ref=f12e123]:
              - text: V
              - subscript [ref=f12e124]: br
              - text: 24.2〜24.7 V
            - listitem [ref=f12e125]: J1 / J2：HV・GND・信号 ×2
        - article [ref=f12e126]:
          - text: 02 / 10
          - heading "バイアスをつくる HV 29.0 V" [level=3] [ref=f12e127]:
            - text: バイアスをつくる
            - generic [ref=f12e128]: HV 29.0 V
          - paragraph [ref=f12e129]: 裏面の LT3461 が USB の 5 V から 29.0 V を昇圧してつくり、降伏電圧より 4.3〜4.8 V 高くかけます。値は抵抗の分圧で固定。子基板の 49.9 Ω と 10 µF でノイズを落としてから SiPM に届けます。
          - list [ref=f12e130]:
            - listitem [ref=f12e131]: HV = 1.255 × (1 + 221k / 10k)
            - listitem [ref=f12e132]: L1 47 µH
        - article [ref=f12e133]:
          - text: 03 / 10
          - heading "増幅する LT1807（U2A）" [level=3] [ref=f12e134]:
            - text: 増幅する
            - generic [ref=f12e135]: LT1807（U2A）
          - paragraph [ref=f12e136]: SiPM の電流は子基板の R12（49.9 Ω）で電圧になり、U2A の非反転アンプで増幅されます。ゲインは裏面のトリマ R10 で ×5.0〜×45。入力は 1 kΩ と BAT54S で守られています。アンプの出力は TP2 で測れます。
          - list [ref=f12e137]:
            - listitem [ref=f12e138]: G = 1 + (R5 + R10) / R3
            - listitem [ref=f12e139]: R3 249 Ω・R5 1 kΩ
            - listitem [ref=f12e140]: DC 結合
        - article [ref=f12e141]:
          - text: 04 / 10
          - heading "山の高さをつかむ ピークホールドとしきい値" [level=3] [ref=f12e142]:
            - text: 山の高さをつかむ
            - generic [ref=f12e143]: ピークホールドとしきい値
          - paragraph [ref=f12e144]: U2B のピークホールドが、数百 ns のパルスの山を 2 倍にしてコンデンサ C6 にためます。ためた電圧は A0 に出てきます。マイコンが読み終わると、D8 から 20 µs のパルスを出して Q1 で放電し、次のパルスに備えます。
          - list [ref=f12e145]:
            - listitem [ref=f12e146]: ホールド ×2
            - listitem [ref=f12e147]: A0 に出力
            - listitem [ref=f12e148]: D8 → Q1 で放電
        - article [ref=f12e149]:
          - text: 05 / 10
          - heading "読み取る Arduino Nano ESP32" [level=3] [ref=f12e150]:
            - text: 読み取る
            - generic [ref=f12e151]: Arduino Nano ESP32
          - paragraph [ref=f12e152]: A0（ホールドの出力）を読み続け、しきい値を超えたらイベントとして扱います。外部検出器の同時判定を待ってから A0 を 12 bit で読み、その値が波高になります。しきい値は起動のたびに、A0 を 1 秒見てノイズの最大値 + 50 に自動で合わせます。
          - list [ref=f12e153]:
            - listitem [ref=f12e154]: ESP32-S3・BLE
            - listitem [ref=f12e155]: A0 をソフトで比較
            - listitem [ref=f12e156]: トリガーの約 60 µs 後に読む
        - article [ref=f12e157]:
          - text: 06 / 10
          - heading "残す microSD" [level=3] [ref=f12e158]:
            - text: 残す
            - generic [ref=f12e159]: microSD
          - paragraph [ref=f12e160]:
            - text: FAT32 のカードに
            - code [ref=f12e161]: /LOG0001.TXT
            - text: から順にログを書きます。1 行ごとに書き込みを確定するので、USB を抜いても失うのはせいぜい最後の 1 行。USB と Bluetooth に出すのと同じ行がそのまま残ります。
          - list [ref=f12e162]:
            - listitem [ref=f12e163]: Hirose DM3AT
            - listitem [ref=f12e164]: SPI 4 MHz
            - listitem [ref=f12e165]: 側面から差す
        - article [ref=f12e166]:
          - text: 07 / 10
          - heading "環境を測る BME280" [level=3] [ref=f12e167]:
            - text: 環境を測る
            - generic [ref=f12e168]: BME280
          - paragraph [ref=f12e169]: 温度・湿度・気圧を 2 秒ごとに読み、各イベントの行に書きます。気圧が上がると計数率が下がる「気圧効果」を調べられます。SiPM の降伏電圧は 1 °C あたり約 21.5 mV 変わるので、温度はあとで波高を見直すときにも使います。
          - list [ref=f12e170]:
            - listitem [ref=f12e171]: I²C
            - listitem [ref=f12e172]: 温度・湿度・気圧
        - article [ref=f12e173]:
          - text: 08 / 10
          - heading "知らせる OLED・LED・ブザー" [level=3] [ref=f12e174]:
            - text: 知らせる
            - generic [ref=f12e175]: OLED・LED・ブザー
          - paragraph [ref=f12e176]: 基板の端に立てた 0.96 インチ OLED に、計数・計数率・しきい値・環境値を 2 秒ごとに表示。イベントごとに LED が光り、ブザーが波高に応じた高さで「ピッ」と鳴ります（対数で 500〜4000 Hz）。A7 に振動モーターを後付けすると、大きなパルスほど長く震えます。
          - list [ref=f12e177]:
            - listitem [ref=f12e178]: SSD1306 128 × 64
            - listitem [ref=f12e179]: 25 ms のビープ
            - listitem [ref=f12e180]: 振動 20〜120 ms
        - article [ref=f12e181]:
          - text: 09 / 10
          - heading "つなぐ 3.5 mm ジャック × 4" [level=3] [ref=f12e182]:
            - text: つなぐ
            - generic [ref=f12e183]: 3.5 mm ジャック × 4
          - paragraph [ref=f12e184]: OUT が 1 つ、IN が 3 つ。自分がトリガーすると COIN_OUT（3.3 V・100 µs）を出し、50 µs 待ってから相手の COIN_OUT を読みます。相手もほぼ同時に反応していれば、そのジャックの列が 1 になります。アナログの波高も読めます。
          - list [ref=f12e185]:
            - listitem [ref=f12e186]: TRRS ケーブル
            - listitem [ref=f12e187]: 最大 4 台
            - listitem [ref=f12e188]: 同時の窓 約 ±50 µs
        - article [ref=f12e189]:
          - text: 10 / 10
          - heading "包む 3D プリントのケース" [level=3] [ref=f12e190]:
            - text: 包む
            - generic [ref=f12e191]: 3D プリントのケース
          - paragraph [ref=f12e192]:
            - text: 底のついた箱に基板を上から入れ、上蓋を M2 ねじ 4 本で留める 2 ピース構成です。前面に OLED の窓と RESET・LED の穴、側面に USB と、ジャック 4 つ・microSD をまとめた四角い開口があります。LED の光は、透明な導光パイプで前面の穴まで導きます。STL は
            - code [ref=f12e193]: cad/
            - text: にあります。
          - list [ref=f12e194]:
            - listitem [ref=f12e195]: FDM 印刷
            - listitem [ref=f12e196]: 86 × 75 × 61.4 mm
            - listitem [ref=f12e197]: 上蓋 ねじ 4 本
