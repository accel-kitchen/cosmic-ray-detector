      - generic [ref=f1e286]:
        - paragraph [ref=f1e287]: 04 — PHYSICS
        - heading "宇宙線を数えるしくみ" [level=2] [ref=f1e288]
        - list [ref=f1e289]:
          - listitem [ref=f1e290]:
            - generic [ref=f1e291]: ①
            - generic [ref=f1e292]:
              - text: 通過
              - paragraph [ref=f1e293]: 一次宇宙線（主に陽子）が大気の上のほうで原子核とぶつかり、粒子のシャワーをつくります。地上に届くのはほとんどがミューオン。海抜 0 m で 1 cm² あたり毎分およそ 1 個です。
          - listitem [ref=f1e294]:
            - generic [ref=f1e295]: ②
            - generic [ref=f1e296]:
              - text: 発光
              - paragraph: ミューオンはシンチレータを通るあいだにエネルギーを落とし、その一部が光になります。GAGG:Ce なら 6 mm で約 6 MeV（緑の光）、プラスチックなら 1 cm で約 2 MeV（青い光）。
          - listitem [ref=f1e297]:
            - generic [ref=f1e298]: ③
            - generic [ref=f1e299]:
              - text: SiPM
