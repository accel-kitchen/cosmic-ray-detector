      - generic [ref=e143]:
        - generic [ref=e144]:
          - paragraph [ref=e145]: 02 — INSIDE
          - heading "部品ごとに、 役割があります。" [level=2] [ref=e146]: 部品ごとに、役割があります。
          - paragraph [ref=e147]: 光を受けてから記録するまで。カメラが該当する部品へ移動します。
        - article [ref=e148]:
          - text: 01 / 10
          - heading "光を受ける シンチレータ × SiPM" [level=3] [ref=e149]:
            - text: 光を受ける
            - generic [ref=e150]: シンチレータ × SiPM
          - paragraph [ref=e151]: ミューオンがシンチレータを通ると、落としたエネルギーの一部が光になります。その光を 6 mm 角の SiPM（onsemi MICROFC-60035）が電気のパルスに変えます。SiPM は 40 mm 角の子基板にのっていて、子基板ごと品種を差し替えられます。
          - list [ref=e152]:
            - listitem [ref=e153]: マイクロセル 35 µm × 18,980
            - listitem [ref=e154]:
              - text: V
              - subscript [ref=e155]: br
              - text: 24.2〜24.7 V
            - listitem [ref=e156]: J1 / J2：HV・GND・信号 ×2
        - article [ref=e157]:
          - text: 02 / 10
          - heading "バイアスをつくる HV 29.0 V" [level=3] [ref=e158]:
            - text: バイアスをつくる
            - generic [ref=e159]: HV 29.0 V
          - paragraph [ref=e160]: 裏面の LT3461 が USB の 5 V から 29.0 V を昇圧してつくり、降伏電圧より 4.3〜4.8 V 高くかけます。値は抵抗の分圧で固定。子基板の 49.9 Ω と 10 µF でノイズを落としてから SiPM に届けます。
          - list [ref=e161]:
            - listitem [ref=e162]: HV = 1.255 × (1 + 221k / 10k)
            - listitem [ref=e163]: L1 47 µH
        - article [ref=e164]:
          - text: 03 / 10
          - heading "増幅する LT1807（U2A）" [level=3] [ref=e165]:
            - text: 増幅する
            - generic [ref=e166]: LT1807（U2A）
          - paragraph [ref=e167]: SiPM の電流は子基板の R12（49.9 Ω）で電圧になり、U2A の非反転アンプで増幅されます。ゲインは裏面のトリマ R10 で ×5.0〜×45。入力は 1 kΩ と BAT54S で守られています。アンプの出力は TP2 で測れます。
          - list [ref=e168]:
            - listitem [ref=e169]: G = 1 + (R5 + R10) / R3
            - listitem [ref=e170]: R3 249 Ω・R5 1 kΩ
            - listitem [ref=e171]: DC 結合
        - article [ref=e172]:
          - text: 04 / 10
          - heading "山の高さをつかむ ピークホールドとコンパレータ" [level=3] [ref=e173]:
            - text: 山の高さをつかむ
            - generic [ref=e174]: ピークホールドとコンパレータ
          - paragraph [ref=e175]: U2B のピークホールドが、数百 ns のパルスの山を 2 倍にしてコンデンサ C6 にためます。マイコンが読み終わると、D8 から 20 µs のパルスを出して Q1 で放電。並行して LT1806 がアンプ出力をしきい値と比べ、超えた瞬間を D0 の割り込みで知らせます（DIGITAL / DUAL モード）。しきい値は D2 の PWM を RC で平らにした電圧です。
          - list [ref=e176]:
            - listitem [ref=e177]: ホールド ×2
            - listitem [ref=e178]: PWM 40 kHz・8 bit
            - listitem [ref=e179]: 1 段 約 6.5 mV
        - article [ref=e180]:
          - text: 05 / 10
          - heading "読み取る Arduino Nano ESP32" [level=3] [ref=e181]:
            - text: 読み取る
            - generic [ref=e182]: Arduino Nano ESP32
          - paragraph [ref=e183]: 起動時の ANALOG モードでは、A0（ホールドの出力）を読み続け、しきい値を超えたらイベントとして扱います。外部検出器の同時判定を待ってから A0 を 12 bit で読み、その値が波高になります。しきい値は起動のたびに、A0 を 1 秒見てノイズの最大値 + 50 に自動で合わせます。
          - list [ref=e184]:
            - listitem [ref=e185]: ESP32-S3・BLE
            - listitem [ref=e186]: ANALOG / DIGITAL / DUAL
            - listitem [ref=e187]: トリガーの約 60 µs 後に読む
        - article [ref=e188]:
          - text: 06 / 10
          - heading "残す microSD" [level=3] [ref=e189]:
            - text: 残す
            - generic [ref=e190]: microSD
          - paragraph [ref=e191]:
            - text: FAT32 のカードに
            - code [ref=e192]: /LOG0001.TXT
            - text: から順にログを書きます。1 行ごとに書き込みを確定するので、USB を抜いても失うのはせいぜい最後の 1 行。USB と Bluetooth に出すのと同じ行がそのまま残ります。
          - list [ref=e193]:
            - listitem [ref=e194]: Hirose DM3AT
            - listitem [ref=e195]: SPI 4 MHz
            - listitem [ref=e196]: 背面から差す
        - article [ref=e197]:
          - text: 07 / 10
          - heading "環境を測る BME280" [level=3] [ref=e198]:
            - text: 環境を測る
            - generic [ref=e199]: BME280
          - paragraph [ref=e200]: 温度・湿度・気圧を 2 秒ごとに読み、各イベントの行に書きます。気圧が上がると計数率が下がる「気圧効果」を調べられます。SiPM の降伏電圧は 1 °C あたり約 21.5 mV 変わるので、温度はあとで波高を見直すときにも使います。
          - list [ref=e201]:
            - listitem [ref=e202]: I²C
            - listitem [ref=e203]: 温度・湿度・気圧
        - article [ref=e204]:
          - text: 08 / 10
          - heading "知らせる OLED・LED・ブザー" [level=3] [ref=e205]:
            - text: 知らせる
            - generic [ref=e206]: OLED・LED・ブザー
          - paragraph [ref=e207]: 基板の端に立てた 0.96 インチ OLED に、計数・計数率・しきい値・環境値を 2 秒ごとに表示。イベントごとに LED が光り、ブザーが波高に応じた高さで「ピッ」と鳴ります（対数で 500〜4000 Hz）。A7 に振動モーターを後付けすると、大きなパルスほど長く震えます。
          - list [ref=e208]:
            - listitem [ref=e209]: SSD1306 128 × 64
            - listitem [ref=e210]: 25 ms のビープ
            - listitem [ref=e211]: 振動 20〜120 ms
        - article [ref=e212]:
          - text: 09 / 10
          - heading "つなぐ 3.5 mm ジャック × 4" [level=3] [ref=e213]:
            - text: つなぐ
            - generic [ref=e214]: 3.5 mm ジャック × 4
          - paragraph [ref=e215]: OUT が 1 つ、IN が 3 つ。自分がトリガーすると COIN_OUT（3.3 V・100 µs）を出し、50 µs 待ってから相手の COIN_OUT を読みます。相手もほぼ同時に反応していれば、そのジャックの列が 1 になります。アナログの波高も読めます。
          - list [ref=e216]:
            - listitem [ref=e217]: TRRS ケーブル
            - listitem [ref=e218]: 最大 4 台
            - listitem [ref=e219]: 同時の窓 約 ±50 µs
        - article [ref=e220]:
          - text: 10 / 10
          - heading "包む 3D プリントのケース" [level=3] [ref=e221]:
            - text: 包む
            - generic [ref=e222]: 3D プリントのケース
          - paragraph [ref=e223]:
            - text: ケース本体は前面だけが閉じた箱で、基板の組を背面から差し込み、厚さ 1 mm の背面板で閉じます。前面に OLED の窓とボタン、側面にジャック 4 つ、背面に USB-C と microSD。STL は
            - code [ref=e224]: cad/
            - text: にあります。
          - list [ref=e225]:
            - listitem [ref=e226]: FDM 印刷
            - listitem [ref=e227]: 76 × 74 × 71.5 mm
            - listitem [ref=e228]: 背面板 ねじ 4 本
