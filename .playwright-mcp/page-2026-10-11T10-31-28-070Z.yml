      - generic [ref=e287]:
        - paragraph [ref=e288]: 04 — PHYSICS
        - heading "宇宙線を数えるしくみ" [level=2] [ref=e289]
        - list [ref=e290]:
          - listitem [ref=e291]:
            - generic [ref=e292]: ①
            - generic [ref=e293]:
              - text: 通過
              - paragraph [ref=e294]: 一次宇宙線（主に陽子）が大気の上のほうで原子核とぶつかり、粒子のシャワーをつくります。地上に届くのはほとんどがミューオン。海抜 0 m で 1 cm² あたり毎分およそ 1 個です。
          - listitem [ref=e295]:
            - generic [ref=e296]: ②
            - generic [ref=e297]:
              - text: 発光
              - paragraph: ミューオンはシンチレータを通るあいだにエネルギーを落とし、その一部が光になります。GAGG:Ce なら 6 mm で約 6 MeV（緑の光）、プラスチックなら 1 cm で約 2 MeV（青い光）。
          - listitem [ref=e298]:
            - generic [ref=e299]: ③
            - generic [ref=e300]:
              - text: SiPM
              - paragraph: 35 µm のマイクロセルが 18,980 個並んだ SiPM。光子が当たったセルで、なだれ増倍が起きます。
          - listitem [ref=e301]:
            - generic [ref=e302]: ④
            - generic [ref=e303]:
              - text: パルス
              - paragraph: 子基板の R12（49.9 Ω）で電圧になります。数百 ns の速いパルスです。
          - listitem [ref=e304]:
            - generic [ref=e305]: ⑤
            - generic [ref=e306]:
              - text: 増幅・ホールド
              - paragraph: ×5〜×45 に増幅し、ピークホールドが山の高さを 2 倍にしてためます。コンパレータは同じ信号をしきい値と比べます。
          - listitem [ref=e307]:
            - generic [ref=e308]: ⑥
            - generic [ref=e309]:
              - text: 記録
              - paragraph: トリガーの約 60 µs 後に A0 を 12 bit で読み、時刻・環境値と一緒に 1 行で出します。読み終えたら D8 でホールドを空にします。
      - generic "宇宙線が記録されるまでのアニメーション" [ref=e311]
    - generic [ref=e313]:
      - generic [ref=e314]:
