            - generic [ref=e119]: "01"
            - generic [ref=e120]:
              - text: ケース本体
              - paragraph: 3D プリント（FDM）の箱、76 × 74 × 71.5 mm。前面に OLED の窓とボタンの穴、側面にジャックの穴が 4 つ。基板は背面から差し込みます。
          - listitem [ref=e121]:
            - generic [ref=e122]: "02"
            - generic [ref=e123]:
              - text: シンチレータ
              - paragraph: ミューオンが通ると光るブロック。反射材と黒テープで包んで、SiPM の上にのせます。
          - listitem [ref=e124]:
            - generic [ref=e125]: "03"
            - generic [ref=e126]:
              - text: SiPM 基板
              - paragraph: 40 × 40 mm。表は 6 mm 角の SiPM だけ。裏に HV のフィルタと 49.9 Ω の負荷抵抗、2×3 ピンのコネクタ。
          - listitem [ref=e127]:
            - generic [ref=e128]: "04"
            - generic [ref=e129]:
              - text: 読み出し基板
              - paragraph: 63 × 63 mm・2 層。HV 電源、アンプ、ピークホールド、コンパレータ、センサ、ジャック、OLED。
          - listitem [ref=e130]:
            - generic [ref=e131]: "05"
            - generic [ref=e132]:
              - text: Arduino Nano ESP32
              - paragraph: 裏面のソケットに差すマイコン。USB-C で給電と通信、BLE 内蔵。
          - listitem [ref=e133]:
            - generic [ref=e134]: "06"
            - generic [ref=e135]:
              - text: 支柱スペーサ
              - paragraph: ケースの床から読み出し基板を 17 mm 持ち上げる 3 本の支柱。下に Nano と microSD が入ります。
          - listitem [ref=e136]:
            - generic [ref=e137]: "07"
            - generic [ref=e138]:
              - text: 背面板
              - paragraph: 厚さ 1 mm。USB-C と microSD の切り欠きがあり、ねじ 4 本でケースに留めます。
