        - paragraph [ref=e114]: 01 — ANATOMY
        - heading "7 つの部品で、 できています。" [level=2] [ref=e115]: 7 つの部品で、できています。
        - paragraph [ref=e116]: スクロールすると 3D モデルが分解します。KiCad の基板データと Inventor のケースから作ったモデルなので、部品の位置は実物と同じです。
        - list [ref=e117]:
