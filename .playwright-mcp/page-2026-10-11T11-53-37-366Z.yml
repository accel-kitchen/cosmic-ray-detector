      - generic [ref=f6e115]:
        - generic [ref=f6e116]:
          - paragraph [ref=f6e117]: 01 — INSIDE
          - heading "部品ごとに、 役割があります。" [level=2] [ref=f6e118]: 部品ごとに、役割があります。
          - paragraph [ref=f6e119]: 光を受けてから記録するまで。カメラが該当する部品へ移動します。
        - article [ref=f6e120]:
          - text: 01 / 10
          - heading "光を受ける シンチレータ × SiPM" [level=3] [ref=f6e121]:
            - text: 光を受ける
            - generic [ref=f6e122]: シンチレータ × SiPM
          - paragraph [ref=f6e123]: ミューオンがシンチレータを通ると、落としたエネルギーの一部が光になります。その光を 6 mm 角の SiPM（onsemi MICROFC-60035）が電気のパルスに変えます。SiPM は 40 mm 角の子基板にのっていて、子基板ごと品種を差し替えられます。
          - list [ref=f6e124]:
            - listitem [ref=f6e125]: マイクロセル 35 µm × 18,980
            - listitem [ref=f6e126]:
              - text: V
              - subscript [ref=f6e127]: br
              - text: 24.2〜24.7 V
            - listitem [ref=f6e128]: J1 / J2：HV・GND・信号 ×2
        - article [ref=f6e129]:
          - text: 02 / 10
          - heading "バイアスをつくる HV 29.0 V" [level=3] [ref=f6e130]:
            - text: バイアスをつくる
            - generic [ref=f6e131]: HV 29.0 V
          - paragraph [ref=f6e132]: 裏面の LT3461 が USB の 5 V から 29.0 V を昇圧してつくり、降伏電圧より 4.3〜4.8 V 高くかけます。値は抵抗の分圧で固定。子基板の 49.9 Ω と 10 µF でノイズを落としてから SiPM に届けます。
          - list [ref=f6e133]:
            - listitem [ref=f6e134]: HV = 1.255 × (1 + 221k / 10k)
            - listitem [ref=f6e135]: L1 47 µH
        - article [ref=f6e136]:
          - text: 03 / 10
          - heading "増幅する LT1807（U2A）" [level=3] [ref=f6e137]:
            - text: 増幅する
            - generic [ref=f6e138]: LT1807（U2A）
          - paragraph [ref=f6e139]: SiPM の電流は子基板の R12（49.9 Ω）で電圧になり、U2A の非反転アンプで増幅されます。ゲインは裏面のトリマ R10 で ×5.0〜×45。入力は 1 kΩ と BAT54S で守られています。アンプの出力は TP2 で測れます。
          - list [ref=f6e140]:
            - listitem [ref=f6e141]: G = 1 + (R5 + R10) / R3
            - listitem [ref=f6e142]: R3 249 Ω・R5 1 kΩ
            - listitem [ref=f6e143]: DC 結合
        - article [ref=f6e144]:
          - text: 04 / 10
          - heading "山の高さをつかむ ピークホールドとしきい値" [level=3] [ref=f6e145]:
            - text: 山の高さをつかむ
            - generic [ref=f6e146]: ピークホールドとしきい値
          - paragraph [ref=f6e147]: U2B のピークホールドが、数百 ns のパルスの山を 2 倍にしてコンデンサ C6 にためます。ためた電圧は A0 に出てきます。マイコンが読み終わると、D8 から 20 µs のパルスを出して Q1 で放電し、次のパルスに備えます。
          - list [ref=f6e148]:
            - listitem [ref=f6e149]: ホールド ×2
            - listitem [ref=f6e150]: A0 に出力
            - listitem [ref=f6e151]: D8 → Q1 で放電
        - article [ref=f6e152]:
          - text: 05 / 10
          - heading "読み取る Arduino Nano ESP32" [level=3] [ref=f6e153]:
            - text: 読み取る
            - generic [ref=f6e154]: Arduino Nano ESP32
          - paragraph [ref=f6e155]: A0（ホールドの出力）を読み続け、しきい値を超えたらイベントとして扱います。外部検出器の同時判定を待ってから A0 を 12 bit で読み、その値が波高になります。しきい値は起動のたびに、A0 を 1 秒見てノイズの最大値 + 50 に自動で合わせます。
          - list [ref=f6e156]:
            - listitem [ref=f6e157]: ESP32-S3・BLE
            - listitem [ref=f6e158]: A0 をソフトで比較
            - listitem [ref=f6e159]: トリガーの約 60 µs 後に読む
        - article [ref=f6e160]:
          - text: 06 / 10
          - heading "残す microSD" [level=3] [ref=f6e161]:
            - text: 残す
            - generic [ref=f6e162]: microSD
          - paragraph [ref=f6e163]:
            - text: FAT32 のカードに
            - code [ref=f6e164]: /LOG0001.TXT
            - text: から順にログを書きます。1 行ごとに書き込みを確定するので、USB を抜いても失うのはせいぜい最後の 1 行。USB と Bluetooth に出すのと同じ行がそのまま残ります。
          - list [ref=f6e165]:
            - listitem [ref=f6e166]: Hirose DM3AT
            - listitem [ref=f6e167]: SPI 4 MHz
            - listitem [ref=f6e168]: 背面から差す
        - article [ref=f6e169]:
          - text: 07 / 10
          - heading "環境を測る BME280" [level=3] [ref=f6e170]:
            - text: 環境を測る
            - generic [ref=f6e171]: BME280
          - paragraph [ref=f6e172]: 温度・湿度・気圧を 2 秒ごとに読み、各イベントの行に書きます。気圧が上がると計数率が下がる「気圧効果」を調べられます。SiPM の降伏電圧は 1 °C あたり約 21.5 mV 変わるので、温度はあとで波高を見直すときにも使います。
          - list [ref=f6e173]:
            - listitem [ref=f6e174]: I²C
            - listitem [ref=f6e175]: 温度・湿度・気圧
        - article [ref=f6e176]:
          - text: 08 / 10
          - heading "知らせる OLED・LED・ブザー" [level=3] [ref=f6e177]:
            - text: 知らせる
            - generic [ref=f6e178]: OLED・LED・ブザー
          - paragraph [ref=f6e179]: 基板の端に立てた 0.96 インチ OLED に、計数・計数率・しきい値・環境値を 2 秒ごとに表示。イベントごとに LED が光り、ブザーが波高に応じた高さで「ピッ」と鳴ります（対数で 500〜4000 Hz）。A7 に振動モーターを後付けすると、大きなパルスほど長く震えます。
          - list [ref=f6e180]:
            - listitem [ref=f6e181]: SSD1306 128 × 64
            - listitem [ref=f6e182]: 25 ms のビープ
            - listitem [ref=f6e183]: 振動 20〜120 ms
        - article [ref=f6e184]:
          - text: 09 / 10
          - heading "つなぐ 3.5 mm ジャック × 4" [level=3] [ref=f6e185]:
            - text: つなぐ
            - generic [ref=f6e186]: 3.5 mm ジャック × 4
          - paragraph [ref=f6e187]: OUT が 1 つ、IN が 3 つ。自分がトリガーすると COIN_OUT（3.3 V・100 µs）を出し、50 µs 待ってから相手の COIN_OUT を読みます。相手もほぼ同時に反応していれば、そのジャックの列が 1 になります。アナログの波高も読めます。
          - list [ref=f6e188]:
            - listitem [ref=f6e189]: TRRS ケーブル
            - listitem [ref=f6e190]: 最大 4 台
            - listitem [ref=f6e191]: 同時の窓 約 ±50 µs
        - article [ref=f6e192]:
          - text: 10 / 10
          - heading "包む 3D プリントのケース" [level=3] [ref=f6e193]:
            - text: 包む
            - generic [ref=f6e194]: 3D プリントのケース
          - paragraph [ref=f6e195]:
            - text: ケース本体は前面だけが閉じた箱で、基板の組を背面から差し込み、厚さ 1 mm の背面板で閉じます。前面に OLED の窓とボタン、側面にジャック 4 つ、背面に USB-C と microSD。STL は
            - code [ref=f6e196]: cad/
            - text: にあります。
          - list [ref=f6e197]:
            - listitem [ref=f6e198]: FDM 印刷
            - listitem [ref=f6e199]: 76 × 74 × 71.5 mm
            - listitem [ref=f6e200]: 背面板 ねじ 4 本
