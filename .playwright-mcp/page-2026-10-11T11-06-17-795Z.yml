    - generic [ref=f3e288]:
      - generic [ref=f3e289]:
        - paragraph [ref=f3e290]: 04 — PHYSICS
        - heading "宇宙線を数えるしくみ" [level=2] [ref=f3e291]
        - list [ref=f3e292]:
          - listitem [ref=f3e293]:
            - generic [ref=f3e294]: ①
            - generic [ref=f3e295]:
              - text: 通過
              - paragraph [ref=f3e296]: 一次宇宙線（主に陽子）が大気の上のほうで原子核とぶつかり、粒子のシャワーをつくります。地上に届くのはほとんどがミューオン。海抜 0 m で 1 cm² あたり毎分およそ 1 個です。
          - listitem [ref=f3e297]:
            - generic [ref=f3e298]: ②
            - generic [ref=f3e299]:
              - text: 発光
              - paragraph: ミューオンはシンチレータを通るあいだにエネルギーを落とし、その一部が光になります。GAGG:Ce なら 6 mm で約 6 MeV（緑の光）、プラスチックなら 1 cm で約 2 MeV（青い光）。
          - listitem [ref=f3e300]:
            - generic [ref=f3e301]: ③
            - generic [ref=f3e302]:
              - text: SiPM
              - paragraph: 35 µm のマイクロセルが 18,980 個並んだ SiPM。光子が当たったセルで、なだれ増倍が起きます。
          - listitem [ref=f3e303]:
            - generic [ref=f3e304]: ④
