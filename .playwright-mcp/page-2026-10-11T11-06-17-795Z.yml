        - heading "実物は、こんな姿です。" [level=2] [ref=f3e268]
        - paragraph [ref=f3e269]: 試作機の写真です。黒いテープで包んだ四角いかたまりがシンチレータと SiPM。手前の青い OLED に計数が出て、基板の端で緑の LED が光ります。
